<title>The Chamber of Secrets Motion Comic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Spectral:wght@400;600&display=swap">
<style>
/* Layout: letterboxed 16:9 cinema stage, slim control bar below it, single dark look */
:root{
  --bg:#0b0a10; --panel:#16131d; --line:#2c2638; --fg:#ece6d8; --dim:#9a92a8;
  --gold:#e2ad45; --gold-ink:#1a1206;
  --display:'Cinzel','Georgia',serif; --body:'Spectral','Georgia',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font:400 clamp(26px,4vw,40px)/1.1 var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:0;color:var(--dim);font-size:14px}
#stageWrap{background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden;line-height:0;position:relative}
#stageWrap:fullscreen{display:flex;align-items:center;justify-content:center;border:0;border-radius:0}
#stage{width:100%;height:auto;display:block;max-height:100vh}
#stageWrap.vert{max-width:min(100%,calc(78vh*9/16));margin:0 auto}
#stageWrap:fullscreen{max-width:none}
#stageWrap:fullscreen #stage{width:auto;height:100%;max-width:100%}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1.4;color:var(--dim);font-size:16px;text-align:center;padding:24px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button,label.btn{font:600 14px/1 var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:11px 16px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px}
button:hover,label.btn:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
button[disabled]{opacity:.45;cursor:default}
button:focus-visible,label.btn:focus-within,input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:92px;text-align:right}
.scrub{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;min-width:0;accent-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;min-height:0;font-size:12px;color:var(--dim)}
.chip.on{color:var(--gold);border-color:var(--gold)}
.note{color:var(--dim);font-size:13px;margin:0}
.note b{color:var(--fg);font-weight:600}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
</style>

<div class="wrap">
  <header>
    <h1>The Chamber of Secrets</h1>
    <p>Brick-built motion comic &middot; Book 2 &middot; 8 scenes &times; 6 s = 48 s</p>
  </header>

  <div id="stageWrap">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <audio id="snd" preload="auto" src="__AUDIO__"></audio>
    <div id="loading">Loading artwork&hellip;</div>
  </div>

  <div class="bar">
    <button id="play" class="primary">&#9654; Play</button>
    <button id="pause">&#10074;&#10074; Pause</button>
    <button id="restart">&#8635; Restart</button>
    <button id="full">&#9974; Fullscreen</button>
    <div class="scrub">
      <input id="seek" type="range" min="0" max="48" step="0.01" value="0" aria-label="Timeline">
      <span class="time" id="time">0:00 / 0:48</span>
    </div>
  </div>
  <div class="bar">
    <div class="chips" id="chips" aria-label="Jump to scene"></div>
  </div>
  <div class="bar">
    <label class="btn" for="file">Load storyboard image&hellip;<input id="file" type="file" accept="image/*"></label>
    <label class="btn" for="narr"><input id="narr" type="checkbox" checked style="position:static;opacity:1;width:auto"> Sound (narration + music)</label>
    <label class="btn" for="caps"><input id="caps" type="checkbox" checked style="position:static;opacity:1;width:auto"> Captions</label>
    <button id="fmt"></button>
    <button id="rec">&#9679; Record WebM</button>
    <span class="note" id="recnote"></span>
  </div>
  <p class="note">Storyboard motion comic. Camera moves and atmosphere are animated overlays on the original artwork; the characters themselves are not individually animated. Spacebar plays and pauses.</p>
</div>

<script>
(function(){
'use strict';
var SRC='__IMG__';
var VERT=!/[?&]landscape/.test(location.search),W=VERT?1080:1920,H=VERT?1920:1080,SCENE_LEN=6,N=8,TOTAL=48,FADE=0.8;
// Source crops inside the 1024x1536 storyboard: below the label strip, inside the borders.
var RECTS=[[2,2,374,503],[385,2,763,503],[773,2,1150,503],[1160,2,1534,503],
           [2,514,374,1022],[385,514,763,1022],[773,514,1150,1022],[1160,514,1534,1022]];
var cv=document.getElementById('stage'),ctx=cv.getContext('2d');
var crops=[],bgs=[];
// Draft narration: only wording taken from the storyboard's own panel titles and what is visible in each panel.
var LINES=["Before the school year begins, Harry receives a warning that something terrible may happen.",
 "Harry and Ron race back to school in an unforgettable\u2014and very bumpy\u2014journey.",
 "Strange attacks spread fear through Hogwarts, and no one knows who will be next.",
 "The friends investigate the school\u2019s past to uncover the secret behind the danger.",
 "A mysterious diary reveals a clue\u2014but its magic may be hiding the truth.",
 "Their search leads deep beneath Hogwarts, where the source of the attacks waits.",
 "Harry risks everything to rescue his friend and stop the threat in the chamber.",
 "The mystery is solved, and hope returns to Hogwarts."];
var TAGS=["1  A WARNING","2  THE FLYING CAR","3  FEAR AT SCHOOL","4  FOLLOWING CLUES","5  THE DIARY","6  BENEATH THE SCHOOL","7  THE RESCUE","8  HOGWARTS IS SAFE"];
var showCaps=true;
function drawCaption(c,i,s){
  if(!showCaps)return;
  var a=ease((s-0.6)/0.6)*(1-ease((s-5.3)/0.5)),ta=ease((s-0.3)/0.6)*(1-ease((s-5.4)/0.5));
  c.save();c.textBaseline='middle';
  if(typeof TAGS!=='undefined'&&ta>0){c.globalAlpha=ta;c.textAlign='left';c.font='600 '+(VERT?30:26)+'px Spectral,Georgia,serif';
    if(c.letterSpacing!==undefined)c.letterSpacing='4px';
    var tw=c.measureText(TAGS[i]).width+40,tx=VERT?40:48,ty=VERT?96:40;c.fillStyle='rgba(6,4,10,0.6)';c.fillRect(tx,ty,tw,48);
    c.fillStyle='#e9e2d6';c.fillText(TAGS[i],tx+20,ty+24);if(c.letterSpacing!==undefined)c.letterSpacing='0px'}
  if(a>0){c.globalAlpha=a;c.textAlign='center';var fs=VERT?46:40,lh=Math.round(fs*1.35);c.font='italic 600 '+fs+'px Spectral,Georgia,serif';
    var words=LINES[i].split(' '),rows=[],cur='',maxw=W*(VERT?0.84:0.78);
    words.forEach(function(wd){var t=cur?cur+' '+wd:wd;if(c.measureText(t).width>maxw&&cur){rows.push(cur);cur=wd}else cur=t});rows.push(cur);
    var bw=Math.min(W*0.94,Math.max.apply(null,rows.map(function(r){return c.measureText(r).width}))+72),bh=rows.length*lh+24,by=H-(VERT?300:56)-bh;
    c.fillStyle='rgba(6,4,10,0.68)';c.fillRect((W-bw)/2,by,bw,bh);
    c.fillStyle='#f6efe0';rows.forEach(function(r,k){c.fillText(r,W/2,by+12+lh/2+k*lh)})}
  c.restore();
}

/* ---------- helpers ---------- */
function fract(x){return x-Math.floor(x)}
function rnd(i,k){return fract(Math.sin(i*127.1+k*311.7)*43758.5453)}
function clamp(x,a,b){return x<a?a:x>b?b:x}
function lerp(a,b,t){return a+(b-a)*t}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function easeIO(t){t=clamp(t,0,1);return 0.5-0.5*Math.cos(Math.PI*t)}
function noise1(t,s){return 0.5+0.25*Math.sin(t*s*1.0+1.3)+0.15*Math.sin(t*s*2.3+4.1)+0.10*Math.sin(t*s*5.1+2.2)}
function glow(c,x,y,r,rgb,a){
  var g=c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba('+rgb+','+a+')');
  g.addColorStop(0.45,'rgba('+rgb+','+(a*0.35)+')');
  g.addColorStop(1,'rgba('+rgb+',0)');
  c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);
}
function blobTex(rgb,seed,n,w,h,a){
  var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
  for(var i=0;i<n;i++){
    var r=h*(0.12+0.18*rnd(i,seed)),px=rnd(i,seed+7)*w,py=r+(h-2*r)*rnd(i,seed+13);
    for(var k=-1;k<=1;k++){
      var g=x.createRadialGradient(px+k*w,py,0,px+k*w,py,r*1.6);
      g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(1,'rgba('+rgb+',0)');
      x.fillStyle=g;x.fillRect(px+k*w-r*1.6,py-r*1.6,r*3.2,r*3.2);
    }
  }
  return c;
}
var fogCool=blobTex('205,215,245',3,22,1024,256,0.5);
var fogWarm=blobTex('255,200,150',9,18,1024,256,0.35);
var smokeDark=blobTex('12,6,18',5,20,1024,256,0.7);

/* scrolling fog band in art space (aw x ah). */
function fogBand(c,aw,ah,tex,y0,y1,alpha,speed,scale,t,phase){
  var tw=aw*scale,dh=(y1-y0)*ah,off=fract(t*speed+(phase||0))*tw;
  c.save();c.globalAlpha*=alpha;
  for(var x=-off;x<aw;x+=tw)c.drawImage(tex,x,y0*ah,tw+1,dh);
  c.restore();
}
/* rising / drifting soft puffs */
function puffs(c,aw,ah,n,t,o){
  for(var i=0;i<n;i++){
    var ph=fract(t/o.period+rnd(i,1)),a=Math.sin(Math.PI*ph);
    var x=(o.x0+(o.x1-o.x0)*rnd(i,2))*aw+Math.sin(t*0.4+i)*aw*0.02+(o.dx||0)*ph*aw;
    var y=(o.y0-o.rise*ph)*ah, r=aw*(o.r0+o.r1*ph)*(0.7+0.6*rnd(i,3));
    glow(c,x,y,r,o.rgb,o.alpha*a);
  }
}
/* floating sparks (additive) */
function sparks(c,aw,ah,n,t,o){
  c.save();c.globalCompositeOperation='lighter';
  for(var i=0;i<n;i++){
    var ph=fract(t/o.period*(0.7+0.6*rnd(i,4))+rnd(i,1)),a=Math.sin(Math.PI*ph);
    var x=(o.x+(rnd(i,2)-0.5)*o.w)*aw+Math.sin(t*1.3+i*2.1)*aw*0.008;
    var y=(o.y-o.rise*ph)*ah, r=1.2+2.6*rnd(i,5);
    glow(c,x,y,r*4,o.rgb,0.55*a);
    c.fillStyle='rgba(255,240,200,'+(0.8*a)+')';c.beginPath();c.arc(x,y,r*0.6,0,6.3);c.fill();
  }
  c.restore();
}
function lights(c,aw,ah,pts,t,rgb,base,amp,rf,speed){
  c.save();c.globalCompositeOperation='lighter';
  pts.forEach(function(p,i){
    var k=base+amp*Math.sin(t*(speed||1.6)+i*1.7)*0.5+amp*0.5;
    glow(c,p[0]*aw,p[1]*ah,aw*rf*(p[2]||1),rgb,k);
  });
  c.restore();
}
function flames(c,aw,ah,pts,t,rgb){
  c.save();c.globalCompositeOperation='lighter';
  pts.forEach(function(p,i){
    var f=noise1(t+i*3.7,7);
    glow(c,p[0]*aw,p[1]*ah,aw*0.075,rgb||'255,150,40',0.22+0.28*f);
    glow(c,p[0]*aw,p[1]*ah,aw*0.022,'255,230,160',0.35+0.35*f);
  });
  c.restore();
}
function vignette(c,aw,ah,a){
  var g=c.createRadialGradient(aw/2,ah/2,ah*0.4,aw/2,ah/2,aw*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+a+')');
  c.fillStyle=g;c.fillRect(0,0,aw,ah);
}

/* ---------- scenes: cam(s) -> {z,fx,fy,px,py}; fx(c,aw,ah,s,t) overlays in art space ---------- */
function glints(c,aw,ah,t,rect,n){
  c.save();c.beginPath();c.rect(rect[0]*aw,rect[1]*ah,rect[2]*aw,rect[3]*ah);c.clip();
  c.globalCompositeOperation='lighter';
  for(var i=0;i<n;i++){
    var ph=fract(t*0.30+i/n),x=(rect[0]+rect[2]*(1.1-1.2*ph))*aw,w=aw*0.05;
    var g=c.createLinearGradient(x-w,0,x+w,0);
    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(255,255,255,0.07)');g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g;c.fillRect(x-w,rect[1]*ah,w*2,rect[3]*ah);
  }
  c.restore();
}
function sway(s,k,a){return (Math.sin(s*4.6+k)*0.6+Math.sin(s*9.1+k*2)*0.4)*a}
function streaks(c,aw,ah,t,n,alpha){
  c.save();c.strokeStyle='rgba(235,242,255,'+alpha+')';c.lineWidth=1.4;c.beginPath();
  for(var i=0;i<n;i++){
    var ph=fract(t*1.1*(0.8+0.5*rnd(i,1))+rnd(i,2)),x=(1.1-1.3*ph)*aw,y=rnd(i,3)*ah,l=aw*(0.06+0.08*rnd(i,4));
    c.moveTo(x,y);c.lineTo(x+l,y-l*0.12);
  }
  c.stroke();c.restore();
}
var SC=[
 /* 1 a warning: cool moonlight through the blinds, dust, push toward Dobby and Harry */
 {cam:function(s){var e=easeIO(s/6);return{z:lerp(1.0,1.32,e),fx:lerp(0.5,0.40,e),fy:lerp(0.5,0.38,e)}},
  fx:function(c,aw,ah,s,t){
    c.save();c.globalCompositeOperation='lighter';
    glow(c,0.66*aw,0.07*ah,aw*0.40,'150,180,230',0.06+0.04*noise1(s,1.3));
    glow(c,0.30*aw,0.30*ah,aw*0.30,'255,200,140',0.03+0.03*noise1(s,2.1));
    c.restore();
    sparks(c,aw,ah,16,s,{x:0.5,w:0.9,y:0.9,rise:0.5,period:10,rgb:'255,225,190'});
    vignette(c,aw,ah,0.40);
  }},
 /* 2 the flying car: headlights, wind, sway, push toward the car */
 {cam:function(s){var e=easeIO(s/6);return{z:lerp(1.0,1.30,e),fx:0.5,fy:lerp(0.5,0.40,e),px:sway(s,0,0.0030),py:sway(s,1.1,0.0034)}},
  fx:function(c,aw,ah,s,t){
    lights(c,aw,ah,[[0.25,0.43,1],[0.77,0.59,1]],s,'255,235,170',0.16,0.18,0.07,1.6);
    lights(c,aw,ah,[[0.13,0.84,1],[0.30,0.80,1],[0.48,0.86,1],[0.60,0.72,1]],s,'255,190,100',0.06,0.08,0.05,1.0);
    fogBand(c,aw,ah,fogCool,0.72,1.0,0.22,0.020,1.4,s,0.3);
    streaks(c,aw,ah,s,26,0.16);
    vignette(c,aw,ah,0.22);
  }},
 /* 3 fear at school: torchlight, drifting dark mist, push toward the students */
 {cam:function(s){var e=easeIO(s/6);return{z:lerp(1.0,1.32,e),fx:lerp(0.5,0.52,e),fy:lerp(0.5,0.58,e)}},
  fx:function(c,aw,ah,s,t){
    flames(c,aw,ah,[[0.67,0.07],[0.76,0.17],[0.85,0.28],[0.92,0.37]],s);
    lights(c,aw,ah,[[0.39,0.17,1]],s,'255,190,70',0.04,0.08,0.03,1.2);
    fogBand(c,aw,ah,smokeDark,0.55,1.0,0.28,0.010,1.4,s,0.2);
    vignette(c,aw,ah,0.42);
  }},
 /* 4 following clues: warm lamplight, dust in the beam, push toward the book */
 {cam:function(s){var e=easeIO(s/6);return{z:lerp(1.0,1.30,e),fx:lerp(0.5,0.65,e),fy:lerp(0.5,0.64,e)}},
  fx:function(c,aw,ah,s,t){
    c.save();c.globalCompositeOperation='lighter';
    glow(c,0.72*aw,0.34*ah,aw*0.34,'255,190,100',0.07+0.04*noise1(s,1.4));
    c.restore();
    flames(c,aw,ah,[[0.74,0.42]],s);
    sparks(c,aw,ah,24,s,{x:0.6,w:0.8,y:0.8,rise:0.3,period:9,rgb:'255,225,170'});
    vignette(c,aw,ah,0.33);
  }},
 /* 5 deeper in: wandlight, drifting mist over the wet floor */
 {cam:function(s){var e=easeIO(s/6);return{z:lerp(1.0,1.32,e),fx:lerp(0.5,0.45,e),fy:lerp(0.5,0.62,e)}},
  fx:function(c,aw,ah,s,t){
    lights(c,aw,ah,[[0.79,0.49,1]],s,'200,225,255',0.14,0.22,0.08,3.0);
    lights(c,aw,ah,[[0.55,0.39,1.4]],s,'200,220,230',0.05,0.05,0.10,0.8);
    fogBand(c,aw,ah,fogCool,0.60,1.0,0.28,0.010,1.3,s,0.4);
    glints(c,aw,ah,s,[0.0,0.78,1.0,0.2],4);
    vignette(c,aw,ah,0.40);
  }},
 /* 6 beneath the school: teal water shimmer, rising mist, slow glow in the eye */
 {cam:function(s){var e=easeIO(s/6);return{z:lerp(1.0,1.30,e),fx:lerp(0.5,0.55,e),fy:lerp(0.5,0.50,e)}},
  fx:function(c,aw,ah,s,t){
    var p=0.5+0.5*Math.sin(s*1.3);
    lights(c,aw,ah,[[0.67,0.13,1]],s,'255,200,60',0.06,0.08,0.04,1.3);
    c.save();c.globalCompositeOperation='lighter';
    glow(c,0.45*aw,0.62*ah,aw*0.40,'60,200,190',0.04+0.03*p);
    c.restore();
    glints(c,aw,ah,s,[0.02,0.55,0.9,0.25],4);
    puffs(c,aw,ah,16,s,{x0:0.0,x1:1.0,y0:0.85,rise:0.45,period:7,r0:0.07,r1:0.07,rgb:'170,210,215',alpha:0.20});
    vignette(c,aw,ah,0.38);
  }},
 /* 7 the rescue: phoenix glow, falling embers, a slow tremor */
 {cam:function(s){var e=easeIO(s/6);return{z:lerp(1.0,1.30,e),fx:lerp(0.5,0.52,e),fy:lerp(0.45,0.42,e),px:sway(s,2,0.0028),py:sway(s,3,0.0024)}},
  fx:function(c,aw,ah,s,t){
    lights(c,aw,ah,[[0.64,0.24,1.6]],s,'255,130,40',0.12,0.16,0.12,1.4);
    lights(c,aw,ah,[[0.39,0.34,1]],s,'255,255,255',0.06,0.10,0.04,2.0);
    sparks(c,aw,ah,28,s,{x:0.6,w:0.9,y:0.08,rise:-0.7,period:7,rgb:'255,140,50'});
    fogBand(c,aw,ah,smokeDark,0.65,1.0,0.25,0.008,1.4,s,0.5);
    vignette(c,aw,ah,0.36);
  }},
 /* 8 Hogwarts is safe: candles and a warm glow over the Great Hall */
 {cam:function(s){var e=easeIO(s/6);return{z:lerp(1.0,1.30,e),fx:lerp(0.5,0.52,e),fy:lerp(0.5,0.70,e)}},
  fx:function(c,aw,ah,s,t){
    flames(c,aw,ah,[[0.19,0.05],[0.51,0.05],[0.63,0.04],[0.85,0.04],[0.07,0.16],[0.30,0.18],[0.75,0.12],[0.81,0.16]],s);
    lights(c,aw,ah,[[0.57,0.80,1.2]],s,'255,200,90',0.08,0.10,0.10,1.0);
    sparks(c,aw,ah,30,s,{x:0.5,w:1.0,y:0.85,rise:0.7,period:9,rgb:'255,215,140'});
    vignette(c,aw,ah,0.26);
  }}
];
function aw_shake(s,k){ // subtle, slow camera shake in normalized px units
  return (Math.sin(s*3.1+k*1.7)*0.5+Math.sin(s*7.3+k*4.1)*0.25)*0.0045;
}

/* ---------- drawing ---------- */
function drawScene(i,s,alpha){
  var cr=crops[i];if(!cr)return;
  var sc=SC[i];
  // blurred fill
  ctx.save();ctx.globalAlpha=alpha;
  ctx.drawImage(bgs[i],0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,'+(VERT?0.22:0.35)+')';ctx.fillRect(0,0,W,H);
  // art rect (contain, no stretching)
  var ar=cr.width/cr.height,aw,ah,cm=sc.cam(s);
  if(VERT&&ar>1.15){
    // Shorts: wide panels fill the width; the camera frames a 9:10 window and pans across the art
    var wh=1100;ah=wh;aw=ar*wh;
    ctx.beginPath();ctx.rect(0,(H-wh)/2,W,wh);ctx.clip();
    var zz=1+(cm.z-1)*0.6,cx=(cm.vx!==undefined?cm.vx:cm.fx)*aw+(cm.px||0)*aw,cy=cm.fy*ah+(cm.py||0)*ah;
    cx=clamp(cx,W/(2*zz),aw-W/(2*zz));cy=clamp(cy,wh/(2*zz),ah-wh/(2*zz));
    ctx.translate(W/2,H/2);ctx.scale(zz,zz);ctx.translate(-cx,-cy);
  }else{
  if(ar>W/H){aw=W;ah=W/ar}else{ah=H;aw=H*ar}
  var ax=(W-aw)/2,ay=(H-ah)/2;
  ctx.beginPath();ctx.rect(ax,ay,aw,ah);ctx.clip();
  ctx.translate(ax,ay);
  var z=cm.z,fx=cm.fx*aw,fy=cm.fy*ah;
  var pxMin=aw-z*aw-fx*(1-z),pxMax=-fx*(1-z),pyMin=ah-z*ah-fy*(1-z),pyMax=-fy*(1-z);
  var px=clamp((cm.px||0)*aw,pxMin,pxMax),py=clamp((cm.py||0)*ah,pyMin,pyMax);
  ctx.translate(fx+px,fy+py);ctx.scale(z,z);ctx.translate(-fx,-fy);
  }
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(cr,0,0,aw,ah);
  sc.fx(ctx,aw,ah,s,s);
  ctx.restore();
  if(sc.top){ctx.save();ctx.globalAlpha=alpha;sc.top(ctx,s);ctx.restore()}
}
function render(t){
  t=clamp(t,0,TOTAL-0.0001);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  var i=Math.min(N-1,Math.floor(t/SCENE_LEN)),s=t-i*SCENE_LEN;
  var a=ease(s/FADE);
  window.__cap=[i,s];
  if(i>0&&s<FADE){drawScene(i-1,SCENE_LEN,1);}
  drawScene(i,s,i===0?a:(s<FADE?a:1));
  drawCaption(ctx,i,s);
}

/* ---------- loading + cropping ---------- */
var lastSrc=null;
function build(img){
  lastSrc=img;crops=[];bgs=[];
  RECTS.forEach(function(r){
    var w=r[2]-r[0],h=r[3]-r[1],k=3;
    var c=document.createElement('canvas');c.width=w*k;c.height=h*k;
    var x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
    x.drawImage(img,r[0],r[1],w,h,0,0,w*k,h*k);
    crops.push(c);
    var b=document.createElement('canvas');b.width=Math.round(W/10);b.height=Math.round(H/10);
    var bx=b.getContext('2d');bx.filter='blur(6px)';
    var sc=Math.max(b.width/c.width,b.height/c.height)*1.15,dw=c.width*sc,dh=c.height*sc;
    bx.drawImage(c,(b.width-dw)/2,(b.height-dh)/2,dw,dh);
    bgs.push(b);
  });
  document.getElementById('loading').hidden=true;
  render(T);
}
function loadSrc(src){
  var im=new Image();
  im.onload=function(){
    if(im.naturalWidth<1000||im.naturalHeight<660){
      var l=document.getElementById('loading');l.hidden=false;
      l.textContent='That image is smaller than the expected 1024×1536 storyboard. Crops may be off.';
    }
    var sx=im.naturalWidth/1536; // support other resolutions of the same layout
    if(Math.abs(sx-1)>0.01){var c=document.createElement('canvas');c.width=1536;c.height=1024;c.getContext('2d').drawImage(im,0,0,1536,1024);build(c)}
    else build(im);
  };
  im.onerror=function(){var l=document.getElementById('loading');l.hidden=false;l.innerHTML='Artwork could not load.<br>Use “Load storyboard image…” below.'};
  im.src=src;
}

/* ---------- transport ---------- */
var T=0,playing=false,last=0,reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(id){return document.getElementById(id)};
function fmt(x){x=Math.floor(x);return Math.floor(x/60)+':'+('0'+x%60).slice(-2)}
function ui(){
  $('seek').value=T;$('time').textContent=fmt(T)+' / 0:48';
  $('play').disabled=playing;$('pause').disabled=!playing;
  var cur=Math.min(N-1,Math.floor(T/SCENE_LEN));
  document.querySelectorAll('.chip').forEach(function(c,i){c.classList.toggle('on',i===cur)});
}
function tick(ts){
  if(playing){
    T+=Math.min(0.1,(ts-last)/1000);last=ts;
    if(T>=TOTAL){T=TOTAL-0.0001;playing=false;if(recording)stopRec()}
  }
  last=ts;
  syncSound();render(T);ui();
  requestAnimationFrame(tick);
}
function syncSound(){
  var a=document.getElementById('snd');if(!a)return;
  try{
    if(playing){if(a.paused){a.currentTime=Math.min(T,47.9);var p=a.play();if(p&&p.catch)p.catch(function(){})}
      else if(Math.abs(a.currentTime-T)>0.4)a.currentTime=Math.min(T,47.9)}
    else if(!a.paused)a.pause();
  }catch(e){}
}
var narrOn=false,spokenFor=-1,voice=null,synth=window.speechSynthesis;
function pickVoice(){
  if(!synth)return;var vs=synth.getVoices().filter(function(v){return /^en/i.test(v.lang)});
  var pref=[/natural/i,/neural/i,/online/i,/google us english/i,/samantha|ava|allison|daniel|aaron|alex/i];
  for(var k=0;k<pref.length;k++){var m=vs.filter(function(v){return pref[k].test(v.name)})[0];if(m){voice=m;return}}
  voice=vs[0]||null;
}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function speakScene(i,hard){
  if(!synth||!narrOn)return;
  if(hard)synth.cancel();spokenFor=i;
  var u=new SpeechSynthesisUtterance(LINES[i]),words=LINES[i].split(' ').length;
  if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-US';u.rate=clamp(words/14,0.95,1.25);u.pitch=0.97;
  setTimeout(function(){if(playing&&spokenFor===i&&narrOn)synth.speak(u)},300);
}
function narrate(){
  if(!playing||!narrOn)return;
  var i=Math.min(N-1,Math.floor(T/SCENE_LEN));
  if(i!==spokenFor)speakScene(i,spokenFor<0||i<spokenFor||i>spokenFor+1);
}
function play(){if(T>=TOTAL-0.01)T=0;playing=true;last=performance.now();ui()}
function pause(){playing=false;if(synth)synth.cancel();spokenFor=-1;ui()}
$('play').onclick=play;$('pause').onclick=pause;
$('restart').onclick=function(){if(synth)synth.cancel();spokenFor=-1;T=0;playing=true;last=performance.now();ui()};
$('seek').oninput=function(e){if(synth)synth.cancel();spokenFor=-1;T=parseFloat(e.target.value);render(T);ui()};
$('full').onclick=function(){
  var w=$('stageWrap');
  if(document.fullscreenElement){document.exitFullscreen()}
  else if(w.requestFullscreen){w.requestFullscreen().catch(function(){$('recnote').textContent='Fullscreen was blocked here. Open the page in its own tab and try again.'})}
};
document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){e.preventDefault();playing?pause():play()}
});
var chips=$('chips');
for(var k=0;k<N;k++)(function(k){
  var b=document.createElement('button');b.className='chip';b.textContent='Scene '+(k+1);
  b.onclick=function(){if(synth)synth.cancel();spokenFor=-1;T=k*SCENE_LEN;render(T);ui()};chips.appendChild(b);
})(k);
$('narr').onchange=function(e){$('snd').muted=!e.target.checked};
$('caps').onchange=function(e){showCaps=e.target.checked;render(T)};
if(!synth){$('narr').disabled=true}
$('file').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  loadSrc(URL.createObjectURL(f));
};

/* ---------- optional in-browser WebM recording (real time) ---------- */
var recording=false,mr=null,chunks=[];
function stopRec(){recording=false;if(mr&&mr.state!=='inactive')mr.stop();$('rec').textContent='● Record WebM'}
$('rec').onclick=function(){
  if(recording){stopRec();return}
  if(!window.MediaRecorder||!cv.captureStream){$('recnote').textContent='This browser cannot record the canvas.';return}
  var mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].filter(function(m){return MediaRecorder.isTypeSupported(m)})[0];
  chunks=[];mr=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:12e6});
  mr.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
  mr.onstop=function(){
    var url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    var a=document.createElement('a');a.href=url;a.download='harry-potter-chamber-of-secrets.webm';document.body.appendChild(a);a.click();a.remove();
    $('recnote').textContent='Recording finished. If no download started, this page is sandboxed: save the HTML locally and record there.';
  };
  T=0;recording=true;mr.start();$('rec').textContent='■ Stop recording';
  $('recnote').textContent='Recording in real time (48 s). Keep this tab visible.';play();
};

function setFormat(v){
  VERT=v;W=v?1080:1920;H=v?1920:1080;cv.width=W;cv.height=H;
  $('stageWrap').classList.toggle('vert',v);$('fmt').textContent=v?'Format: Shorts 9:16':'Format: Landscape 16:9';
  if(lastSrc)build(lastSrc);
}
$('fmt').onclick=function(){setFormat(!VERT)};
setFormat(VERT);
window.__renderAt=function(t){T=t;render(t)};
window.__ready=function(){return crops.length===8};
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 30px Cinzel')]).catch(function(){}):Promise.resolve()).then(function(){
  loadSrc(SRC);
  if(!reduce&&!/[?&]render/.test(location.search)){/* idle on first frame until Play */}
  requestAnimationFrame(tick);
});
})();
</script>
