<title>The Chamber of Secrets Motion Comic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Spectral:wght@400;600&display=swap">
<style>
/* Layout: letterboxed 16:9 cinema stage, slim control bar below it, single dark look */
:root{
  --bg:#0b0a10; --panel:#16131d; --line:#2c2638; --fg:#ece6d8; --dim:#9a92a8;
  --gold:#e2ad45; --gold-ink:#1a1206;
  --display:'Cinzel','Georgia',serif; --body:'Spectral','Georgia',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font:400 clamp(26px,4vw,40px)/1.1 var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:0;color:var(--dim);font-size:14px}
#stageWrap{background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden;line-height:0;position:relative}
#stageWrap:fullscreen{display:flex;align-items:center;justify-content:center;border:0;border-radius:0}
#stage{width:100%;height:auto;display:block;max-height:100vh}
#stageWrap.vert{max-width:min(100%,calc(78vh*9/16));margin:0 auto}
#stageWrap:fullscreen{max-width:none}
#stageWrap:fullscreen #stage{width:auto;height:100%;max-width:100%}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1.4;color:var(--dim);font-size:16px;text-align:center;padding:24px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button,label.btn{font:600 14px/1 var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:11px 16px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px}
button:hover,label.btn:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
button[disabled]{opacity:.45;cursor:default}
button:focus-visible,label.btn:focus-within,input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:92px;text-align:right}
.scrub{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;min-width:0;accent-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;min-height:0;font-size:12px;color:var(--dim)}
.chip.on{color:var(--gold);border-color:var(--gold)}
.note{color:var(--dim);font-size:13px;margin:0}
.note b{color:var(--fg);font-weight:600}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
</style>

<div class="wrap">
  <header>
    <h1>The Chamber of Secrets</h1>
    <p>Brick-built motion comic &middot; Book 2 &middot; 8 scenes &times; 6 s = 48 s</p>
  </header>

  <div id="stageWrap">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <div id="loading">Loading artwork&hellip;</div>
  </div>

  <div class="bar">
    <button id="play" class="primary">&#9654; Play</button>
    <button id="pause">&#10074;&#10074; Pause</button>
    <button id="restart">&#8635; Restart</button>
    <button id="full">&#9974; Fullscreen</button>
    <div class="scrub">
      <input id="seek" type="range" min="0" max="48" step="0.01" value="0" aria-label="Timeline">
      <span class="time" id="time">0:00 / 0:48</span>
    </div>
  </div>
  <div class="bar">
    <div class="chips" id="chips" aria-label="Jump to scene"></div>
  </div>
  <div class="bar">
    <label class="btn" for="file">Load storyboard image&hellip;<input id="file" type="file" accept="image/*"></label>
    <label class="btn" for="narr"><input id="narr" type="checkbox" checked style="position:static;opacity:1;width:auto"> Narration (device voice)</label>
    <label class="btn" for="caps"><input id="caps" type="checkbox" checked style="position:static;opacity:1;width:auto"> Captions</label>
    <button id="fmt"></button>
    <button id="rec">&#9679; Record WebM</button>
    <span class="note" id="recnote"></span>
  </div>
  <p class="note">Storyboard motion comic. Camera moves and atmosphere are animated overlays on the original artwork; the characters themselves are not individually animated. Spacebar plays and pauses.</p>
</div>

function drawScene(i,s,alpha){
  var cr=crops[i];if(!cr)return;

  ctx.drawImage(bgs[i],0,0,W,H);

  // art rect (contain, no stretching)
  var ar=cr.width/cr.height,aw,ah,cm=sc.cam(s);
  if(VERT&&ar>1.15){
    // Shorts: wide panels fill the width; the camera frames a 9:10 window and pans across the art
    var wh=1100;ah=wh;aw=ar*wh;
    ctx.beginPath();ctx.rect(0,(H-wh)/2,W,wh);ctx.clip();
    var zz=1+(cm.z-1)*0.6,cx=(cm.vx!==undefined?cm.vx:cm.fx)*aw+(cm.px||0)*aw,cy=cm.fy*ah+(cm.py||0)*ah;
    cx=clamp(cx,W/(2*zz),aw-W/(2*zz));cy=clamp(cy,wh/(2*zz),ah-wh/(2*zz));
    ctx.translate(W/2,H/2);ctx.scale(zz,zz);ctx.translate(-cx,-cy);
  }else{

  var ax=(W-aw)/2,ay=(H-ah)/2;
  ctx.beginPath();ctx.rect(ax,ay,aw,ah);ctx.clip();
  ctx.translate(ax,ay);
  var z=cm.z,fx=cm.fx*aw,fy=cm.fy*ah;
  var pxMin=aw-z*aw-fx*(1-z),pxMax=-fx*(1-z),pyMin=ah-z*ah-fy*(1-z),pyMax=-fy*(1-z);
  var px=clamp((cm.px||0)*aw,pxMin,pxMax),py=clamp((cm.py||0)*ah,pyMin,pyMax);
  ctx.translate(fx+px,fy+py);ctx.scale(z,z);ctx.translate(-fx,-fy);
  }
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(cr,0,0,aw,ah);

}
function render(t){

var lastSrc=null;
function build(img){
  lastSrc=img;crops=[];bgs=[];
  RECTS.forEach(function(r){
    var w=r[2]-r[0],h=r[3]-r[1],k=3;
    var c=document.createElement('canvas');c.width=w*k;c.height=h*k;
    var x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
    x.drawImage(img,r[0],r[1],w,h,0,0,w*k,h*k);
    crops.push(c);
    var b=document.createElement('canvas');b.width=Math.round(W/10);b.height=Math.round(H/10);
    var bx=b.getContext('2d');bx.filter='blur(6px)';

    bx.drawImage(c,(b.width-dw)/2,(b.height-dh)/2,dw,dh);

}

    if(im.naturalWidth<1000||im.naturalHeight<660){
      var l=document.getElementById('loading');l.hidden=false;
      l.textContent='That image is smaller than the expected 1024×1536 storyboard. Crops may be off.';
    }
    var sx=im.naturalWidth/1536; // support other resolutions of the same layout
    if(Math.abs(sx-1)>0.01){var c=document.createElement('canvas');c.width=1536;c.height=1024;c.getContext('2d').drawImage(im,0,0,1536,1024);build(c)}

  im.src=src;
}

  var u=new SpeechSynthesisUtterance(LINES[i]),words=LINES[i].split(' ').length;
  if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-US';u.rate=clamp(words/14,0.95,1.25);u.pitch=0.97;
  setTimeout(function(){if(playing&&spokenFor===i&&narrOn)synth.speak(u)},300);
}
function narrate(){
  if(!playing||!narrOn)return;
  var i=Math.min(N-1,Math.floor(T/SCENE_LEN));
  if(i!==spokenFor)speakScene(i,spokenFor<0||i<spokenFor||i>spokenFor+1);
}
