<template>
  <style>
    #root { position: absolute; inset: 0; background: #070707; overflow: hidden; }
    #__ID__-v { position: absolute; left: 0; top: 189px; width: 1920px; height: 702px; overflow: hidden; background: #070707; }
    #__ID__-sh, #__ID__-p, #__ID__-k { position: absolute; inset: 0; }
    #__ID__-img { position: absolute; left: 0; top: 0; width: 1920px; height: 702px; object-fit: cover; }
    #__ID__-scan { position: absolute; left: 20px; top: 0; width: 12px; height: 702px; background: #9dffbe; opacity: 0; }
    #__ID__-blink { position: absolute; left: 0; top: 0; width: 560px; height: 702px; background: #5dff8a; opacity: 0; mix-blend-mode: screen; }
    #__ID__-emb { position: absolute; inset: 0; }
    #__ID__-emb .ember { position: absolute; border-radius: 50%; opacity: 0; }
    #__ID__-fl { position: absolute; inset: 0; background: #ff7a1f; mix-blend-mode: screen; opacity: 0; }
    #__ID__-flash { position: absolute; inset: 0; background: #fff7ea; opacity: 0; }
    #__ID__-dip { position: absolute; inset: 0; background: #070707; opacity: 0; }
    #__ID__-tt { position: absolute; left: 96px; top: 58px; height: 90px; display: flex; align-items: center; gap: 22px; }
    #__ID__-num { font-family: "League Gothic", sans-serif; font-size: 64px; line-height: 1; color: #070707; background: #f2c14e; padding: 8px 14px 4px; border-radius: 6px; }
    #__ID__-ttl { font-family: "League Gothic", sans-serif; font-size: 80px; line-height: 1; letter-spacing: 1px; color: #f2c14e; white-space: nowrap; }
    #__ID__-cap { position: absolute; left: 96px; top: 916px; font-family: "Inter", sans-serif; font-weight: 700; font-size: 46px; line-height: 1.2; color: #f4f1ea; white-space: nowrap; }
    #__ID__-cap .w { display: inline-block; margin-right: 0.26em; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080" data-layout-allow-overflow>
    <div id="__ID__-v">
      <div id="__ID__-sh"><div id="__ID__-p"><div id="__ID__-k">
        <img id="__ID__-img" src="__IMG__" alt="" />
        <div id="__ID__-scan"></div>
        <div id="__ID__-blink"></div>
      </div></div></div>
      <div id="__ID__-fl"></div>
      <div id="__ID__-emb">__EMBERS__</div>
    </div>
    <div id="__ID__-tt"><div id="__ID__-num">__N__</div><div id="__ID__-ttl">__TITLE__</div></div>
    <div id="__ID__-cap">__CAPWORDS__</div>
    <div id="__ID__-flash"></div>
    <div id="__ID__-dip"></div>
  </div>
  <script>
    (function () {
      var C = __CFG__;
      var P = "#" + C.id + "-";
      var D = C.D, kb = C.kb;
      var tl = gsap.timeline({ paused: true });
      gsap.set([P + "num", P + "ttl", P + "cap .w"], { opacity: 0 });

      // camera: one continuous move across the panel
      tl.fromTo(P + "k", { scale: kb[0], x: kb[2], y: kb[4] }, { scale: kb[1], x: kb[3], y: kb[5], duration: D, ease: "sine.inOut" }, 0);

      // entrance, caused by the cut
      if (C.enter === "dip") tl.fromTo(P + "dip", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
      if (C.enter === "flash") tl.fromTo(P + "flash", { opacity: 1 }, { opacity: 0, duration: 0.42, ease: "power2.out" }, 0);
      if (C.enter === "whipR") tl.fromTo(P + "p", { x: 1500 }, { x: 0, duration: 0.34, ease: "power3.out" }, 0);
      if (C.enter === "whipL") tl.fromTo(P + "p", { x: -1500 }, { x: 0, duration: 0.34, ease: "power3.out" }, 0);
      if (C.enter === "glitch") {
        [[-60, 0], [42, 0.05], [-24, 0.1], [70, 0.14], [-12, 0.19], [0, 0.24]].forEach(function (g) { tl.set(P + "p", { x: g[0] }, g[1]); });
        tl.fromTo(P + "dip", { opacity: 0.7 }, { opacity: 0, duration: 0.24, ease: "steps(4)" }, 0);
      }

      // story effects
      C.punches.forEach(function (t) { tl.set(P + "p", { scale: 1.22 }, t); });
      C.shakes.forEach(function (t) {
        C.jitter.forEach(function (j, k) {
          var a = 22 * (1 - k / C.jitter.length);
          tl.set(P + "sh", { x: j[0] * a, y: j[1] * a }, t + k * 0.04);
        });
        tl.set(P + "sh", { x: 0, y: 0 }, t + C.jitter.length * 0.04);
      });
      if (C.fx.indexOf("scan") >= 0) {
        tl.set(P + "scan", { opacity: 0.6 }, 0.6);
        tl.fromTo(P + "scan", { x: 0 }, { x: 700, duration: 1.5, ease: "none" }, 0.6);
        tl.fromTo(P + "scan", { x: 0 }, { x: 700, duration: 1.5, ease: "none", immediateRender: false }, 2.4);
        tl.set(P + "scan", { opacity: 0 }, 3.9);
      }
      if (C.fx.indexOf("blink") >= 0) {
        tl.fromTo(P + "blink", { opacity: 0 }, { opacity: 0.32, duration: 0.16, ease: "steps(1)", yoyo: true, repeat: 7 }, 1.0);
      }
      if (C.fx.indexOf("flicker") >= 0) {
        C.flick.forEach(function (v, k) { tl.set(P + "fl", { opacity: v }, k * (D / C.flick.length)); });
      }
      if (C.embers.length) {
        var els = document.querySelectorAll(P + "emb .ember");
        C.embers.forEach(function (e, k) {
          var d = e[0], L = e[1], dx = e[2], dy = e[3];
          var start = Math.max(0, d), f = d < 0 ? -d / L : 0, dur = L - (start - d);
          tl.fromTo(els[k], { x: dx * f, y: dy * f }, { x: dx, y: dy, duration: dur, ease: "none" }, start);
          tl.fromTo(els[k], { opacity: d < 0 ? 0.9 : 0 }, { opacity: 0.9, duration: 0.25 }, start);
          tl.to(els[k], { opacity: 0, duration: 0.5 }, start + dur - 0.5);
        });
      }
      if (C.fx.indexOf("fadeout") >= 0) tl.fromTo(P + "dip", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.in", immediateRender: false }, D - 0.85);

      // type: number chip, title wipes on, caption word by word
      tl.fromTo(P + "num", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 0.18);
      tl.fromTo(P + "ttl", { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.out" }, 0.26);
      tl.fromTo(P + "cap .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.06, ease: "power2.out" }, 0.55);
      tl.to([P + "tt", P + "cap"], { opacity: 0, duration: 0.18, ease: "power2.in" }, D - 0.24);

      window.__timelines[C.id] = tl;
    })();
  </script>
</template>
