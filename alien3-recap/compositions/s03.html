  <script>
    (function () {
      var C = {"id": "s03", "D": 4.6, "kb": [1.1, 1.26, 0, -60, 10, 40], "enter": "cut", "fx": [], "embers": [], "flick": [0.164, 0.133, 0.216, 0.153, 0.154, 0.056, 0.127, 0.159, 0.154, 0.07, 0.118, 0.128, 0.257, 0.215, 0.257, 0.058, 0.103, 0.174, 0.064, 0.103, 0.179, 0.05, 0.14, 0.057, 0.105, 0.256, 0.139, 0.112, 0.26, 0.247, 0.109, 0.148, 0.095, 0.226, 0.154, 0.227, 0.224, 0.081, 0.081, 0.221], "shakes": [], "punches": [], "jitter": [[0.74, -0.64], [0.72, -0.59], [-0.32, 0.27], [-0.7, 0.02], [-0.13, -0.8], [-0.88, -0.14], [0.0, 0.02], [-0.87, -0.14], [0.95, 0.42], [-0.35, 0.39]]};

      if (C.enter === "whipL") tl.fromTo(P + "p", { x: -1500 }, { x: 0, duration: 0.34, ease: "power3.out" }, 0);
      if (C.enter === "glitch") {
        [[-60, 0], [42, 0.05], [-24, 0.1], [70, 0.14], [-12, 0.19], [0, 0.24]].forEach(function (g) { tl.set(P + "p", { x: g[0] }, g[1]); });

        tl.fromTo(P + "scan", { x: 0 }, { x: 700, duration: 1.5, ease: "none" }, 0.6);
        tl.fromTo(P + "scan", { x: 0 }, { x: 700, duration: 1.5, ease: "none", immediateRender: false }, 2.4);
        tl.set(P + "scan", { opacity: 0 }, 3.9);
      }
      if (C.fx.indexOf("blink") >= 0) {
        tl.fromTo(P + "blink", { opacity: 0 }, { opacity: 0.32, duration: 0.16, ease: "steps(1)", yoyo: true, repeat: 7 }, 1.0);
      }
      if (C.fx.indexOf("flicker") >= 0) {
        C.flick.forEach(function (v, k) { tl.set(P + "fl", { opacity: v }, k * (D / C.flick.length)); });
      }
      if (C.embers.length) {
        var els = document.querySelectorAll(P + "emb .ember");
        C.embers.forEach(function (e, k) {
          var d = e[0], L = e[1], dx = e[2], dy = e[3];
          var start = Math.max(0, d), f = d < 0 ? -d / L : 0, dur = L - (start - d);
          tl.fromTo(els[k], { x: dx * f, y: dy * f }, { x: dx, y: dy, duration: dur, ease: "none" }, start);
          tl.fromTo(els[k], { opacity: d < 0 ? 0.9 : 0 }, { opacity: 0.9, duration: 0.25 }, start);
          tl.to(els[k], { opacity: 0, duration: 0.5 }, start + dur - 0.5);
        });
      }
      if (C.fx.indexOf("fadeout") >= 0) tl.fromTo(P + "dip", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.in", immediateRender: false }, D - 0.85);

      // type: number chip, title wipes on, caption word by word
      tl.fromTo(P + "num", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 0.18);
      tl.fromTo(P + "ttl", { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.out" }, 0.26);
      tl.fromTo(P + "cap .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.06, ease: "power2.out" }, 0.55);
      tl.to([P + "tt", P + "cap"], { opacity: 0, duration: 0.18, ease: "power2.in" }, D - 0.24);

      window.__timelines[C.id] = tl;
    })();
