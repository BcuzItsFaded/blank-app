<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Montserrat;src:url(Montserrat.ttf);font-weight:100 900}html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="words.js"></script><script src="lib.js"></script><script src="kaiju.js"></script><script src="shots.js"></script>
<script>
const cv=document.getElementById('c'); ctx=cv.getContext('2d');
const sub=document.createElement('canvas'); sub.width=W; sub.height=H; const sctx=sub.getContext('2d');
window.END=END;
window.seek=t=>{ctx=cv.getContext('2d'); frame(t);};
window.seekBlur=(t,n,span)=>{ const main=cv.getContext('2d'); main.setTransform(1,0,0,1,0,0); main.globalAlpha=1;
  for(let k=0;k<n;k++){ ctx=sctx; frame(t+span*k/n); main.globalAlpha=1/(k+1); main.drawImage(sub,0,0);} main.globalAlpha=1; ctx=main; };
window.grab=q=>cv.toDataURL('image/jpeg',q);
window.collect=()=>{COLLECT=true;EVSET.clear(); ctx=sctx; for(let t=0;t<END;t+=1/30) frame(t); COLLECT=false; return [...EVSET].map(s=>{const [k,v]=s.split('|');return {type:k,t:+v};}).sort((a,b)=>a.t-b.t);};
document.fonts.load('800 40px Montserrat').then(()=>{ build(); window.EV=null; window.READY=true; });
</script></body></html>
