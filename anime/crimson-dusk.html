<title>Crimson Dusk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Chakra+Petch:wght@400;600&display=swap">
<style>
/* Layout: a dark screening room. The 16:9 screen is the hero; transport controls and the scene list sit beneath it. */
:root{
  --bg:#0c0a11; --panel:#15121c; --line:#2b2536; --fg:#eee7f3; --muted:#9b90ad; --accent:#ff5a3c; --accent2:#86e1ff;
  --display:'Dela Gothic One','Impact','Arial Black',sans-serif;
  --ui:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.4vw,34px);letter-spacing:.04em;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.screen{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%}
.bigplay{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(10,8,14,.45);color:#fff;font-size:30px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(3px)}
.bigplay:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.bar button{font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}
.bar button:hover{border-color:var(--muted)}
.bar button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#scrub{flex:1 1 220px;min-width:0;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:92px;text-align:right}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.scenes button{font-family:var(--ui);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--muted);padding:8px 10px;cursor:pointer;font-size:12px;display:flex;gap:8px;align-items:baseline}
.scenes button b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.scenes button.on{border-color:var(--accent);color:var(--fg)}
.cast{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:13px;line-height:1.5}
.cast div{max-width:60ch}
.cast strong{color:var(--fg);letter-spacing:.06em}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
@media (prefers-reduced-motion: reduce){.bigplay{backdrop-filter:none}}
</style>

<div class="wrap">
  <header>
    <h1>CRIMSON <span>DUSK</span></h1>
    <div class="sub">Episode 01 · Rooftop at sundown · 16:9</div>
  </header>
  <div class="screen" id="screenBox">
    <canvas id="screen" width="1280" height="720" aria-label="Animated fight sequence"></canvas>
    <button class="bigplay" id="bigplay" aria-label="Play">▶</button>
  </div>
  <div class="bar">
    <button id="play" aria-label="Play or pause">Play</button>
    <button id="restart">Restart</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Timeline">
    <span class="time" id="time">0:00.0 / 0:00</span>
    <button id="sound" aria-pressed="false">Sound off</button>
    <button id="loop" aria-pressed="true">Loop</button>
    <button id="fs">Fullscreen</button>
  </div>
  <div class="scenes" id="scenes"></div>
  <div class="cast">
    <div><span class="sw" style="background:#e0303a"></span><strong>HAYATE</strong> — torn white gi, red headband and wraps. Fights close, finishes with a blue ki wave.</div>
    <div><span class="sw" style="background:#62ffb4"></span><strong>ZARA</strong> — violet bodysuit, gold trim, silver ponytail. Jade-lit gauntlets fire energy at range.</div>
  </div>
</div>

<script>
'use strict';
// ============================================================ core
const W=1280,H=720,TAU=Math.PI*2,PI=Math.PI;
const cv=document.getElementById('screen'),ctx=cv.getContext('2d');
let KPX=1; // pixel scale of the canvas backing store
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const E={lin:t=>t,io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,
  snap:t=>1-Math.pow(1-t,6),sine:t=>-(Math.cos(PI*t)-1)/2,hold:t=>t<1?0:1,
  back:t=>{const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}};
function hash(n){const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s)}
function noise(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1}
const dir=a=>[Math.sin(a),Math.cos(a)];
const add=(a,b,s=1)=>[a[0]+b[0]*s,a[1]+b[1]*s];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const lp=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
const nrm=v=>{const l=Math.hypot(v[0],v[1])||1;return[v[0]/l,v[1]/l]};
const INK='#1c1022';

// colour helpers (cached)
const _hx={};function hx(c){return _hx[c]||(_hx[c]=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)])}
const _mx=new Map();
function mix(a,b,t){const k=a+b+t.toFixed(3);let r=_mx.get(k);if(r)return r;const A=hx(a),B=hx(b);
  r='#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');_mx.set(k,r);return r}
function rgba(c,a){const A=hx(c);return `rgba(${A[0]},${A[1]},${A[2]},${a})`}

// ============================================================ lighting + cel shading
let LIGHT={id:0,dir:[.55,-.83],rim:'#ffd9a8',rimAmt:.55,amb:'#4a2c6a',ambAmt:.22,key:'#ffb37a',keyAmt:.06};
let LDIR=LIGHT.dir, FLAT=null, CEL_K=4, CEL_R=1.4;
function setLight(o){LIGHT=Object.assign({},LIGHT,o,{id:LIGHT.id+1});LDIR=LIGHT.dir}
const _mat=new Map();
function M(m,back){const k=m[0]+m[1]+(back?1:0)+'|'+LIGHT.id;let r=_mat.get(k);if(r)return r;
  let b=mix(m[0],LIGHT.key,LIGHT.keyAmt),s=mix(m[1],LIGHT.amb,LIGHT.ambAmt),h=mix(m[0],LIGHT.rim,LIGHT.rimAmt);
  if(back){b=mix(b,LIGHT.amb,.28);s=mix(s,LIGHT.amb,.28);h=mix(h,LIGHT.amb,.2)}
  r=[b,s,h];_mat.set(k,r);return r}
// path(): builds a path. Lit core = shape ∩ shape shifted toward light; rim = thin band on the light edge.
function cel(path,m,k=CEL_K,r=CEL_R,lw){
  if(FLAT){path();ctx.fillStyle=FLAT;ctx.fill();return}
  const L=LDIR;ctx.save();path();ctx.clip();
  ctx.fillStyle=r?m[2]:m[1];ctx.fillRect(-5e3,-5e3,1e4,1e4);
  if(r){ctx.translate(-L[0]*r,-L[1]*r);path();ctx.clip();ctx.fillStyle=m[1];ctx.fillRect(-5e3,-5e3,1e4,1e4)}
  ctx.translate(L[0]*k,L[1]*k);path();ctx.fillStyle=m[0];ctx.fill();ctx.restore();
  if(lw){path();ctx.lineWidth=lw;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.stroke()}
}
function tubePath(pts,rs){
  const n=pts.length,Lp=[],Rp=[],N=[];
  for(let i=0;i<n;i++){const a=pts[Math.max(i-1,0)],b=pts[Math.min(i+1,n-1)];const t=nrm(sub(b,a));const nn=[-t[1],t[0]];N.push(nn);
    Lp.push(add(pts[i],nn,rs[i]));Rp.push(add(pts[i],nn,-rs[i]))}
  ctx.beginPath();ctx.moveTo(Lp[0][0],Lp[0][1]);for(let i=1;i<n;i++)ctx.lineTo(Lp[i][0],Lp[i][1]);
  let an=Math.atan2(N[n-1][1],N[n-1][0]);ctx.arc(pts[n-1][0],pts[n-1][1],rs[n-1],an,an-PI,true);
  for(let i=n-1;i>=0;i--)ctx.lineTo(Rp[i][0],Rp[i][1]);
  an=Math.atan2(N[0][1],N[0][0]);ctx.arc(pts[0][0],pts[0][1],rs[0],an+PI,an,true);ctx.closePath();
}
function smooth(pts,closed=true,begin=true){
  const n=pts.length,g=i=>pts[closed?(i+n)%n:clamp(i,0,n-1)];
  if(begin){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1])}else ctx.lineTo(pts[0][0],pts[0][1]);
  const last=closed?n:n-1;
  for(let i=0;i<last;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1])}
  if(closed)ctx.closePath();
}
function poly(pts,begin=true){if(begin)ctx.beginPath();pts.forEach((p,i)=>i||!begin?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()}
// blade-like spikes: alternating root/tip points joined with gently bowed curves
function spikePath(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<=pts.length;i++){const a=pts[i-1],b=pts[i%pts.length];const m=lp(a,b,.5),d=sub(b,a);const bow=(i%2?.13:-.08);
    ctx.quadraticCurveTo(m[0]-d[1]*bow,m[1]+d[0]*bow,b[0],b[1])}ctx.closePath()}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(r,.01),0,TAU)}

// flowing chain (ribbons, ponytails). base angle in dir() convention.
function chain(start,ang,n,seg,t,amp,freq,seed,taper=1){
  const pts=[start];let p=start;
  for(let i=1;i<=n;i++){const u=i/n;const a=ang+Math.sin(t*freq-i*.9+seed)*amp*u+noise(t*1.7+i*.5+seed*3)*amp*.5*u;
    p=add(p,dir(a),seg*(1-u*(1-taper)*.3));pts.push(p)}
  return pts}

// ============================================================ characters
const HAY={d:{spine:56,neck:7,hr:14.5,ua:33,fa:31,th:46,sh:46,ft:19,kr:10,fr:5},
  skin:['#f1c09a','#c27f68'],gi:['#f4f0e8','#a59fc4'],belt:['#2d2433','#140f19'],band:['#e2303b','#8c1527'],
  hair:['#272439','#110f19'],glove:['#c9323b','#741524'],iris:['#7a4a2a','#2b170c','#c98b4c'],energy:'#86e1ff'};
const ZAR={d:{spine:53,neck:7,hr:13.5,ua:31,fa:29,th:48,sh:48,ft:18,kr:9,fr:5},
  skin:['#f6d2bd','#c8958d'],suit:['#45367d','#231a4d'],trim:['#f0c058','#a4702a'],hair:['#eceef8','#9da1c8'],
  gaunt:['#33445f','#18202f'],boot:['#2b2245','#140e24'],iris:['#a066ff','#3b1a7a','#e0c4ff'],lip:'#c2466a',energy:'#62ffb4'};

const KEYS=['x','y','lean','head','shF','elF','shB','elB','hpF','knF','hpB','knB','gr','rot','sc'];
const BASE={x:0,y:-90,f:1,lean:0,head:0,shF:.2,elF:.3,shB:.1,elB:.3,hpF:.1,knF:.1,hpB:-.1,knB:.1,gr:1,rot:0,sc:1,expr:'neutral'};
const P=(...o)=>Object.assign({},BASE,...o);
function lerpPose(a,b,t){const o=Object.assign({},t<.5?a:b);for(const k of KEYS)o[k]=lerp(a[k],b[k],t);return o}
function track(keys){return t=>{if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const[t0,p0]=keys[i],[t1,p1,e]=keys[i+1];if(t<t1)return lerpPose(p0,p1,(E[e||'io'])((t-t0)/(t1-t0)))}
  return keys[keys.length-1][1]}}
function ctrack(keys){return t=>{if(t<=keys[0][0])return Object.assign({},keys[0][1]);
  for(let i=0;i<keys.length-1;i++){const[t0,a]=keys[i],[t1,b,e]=keys[i+1];if(t<t1){const u=(E[e||'io'])((t-t0)/(t1-t0));const o={};for(const k in a)o[k]=lerp(a[k],b[k]??a[k],u);return o}}
  return Object.assign({},keys[keys.length-1][1])}}
// hit-stop: time freezes for `hold` seconds after each impact
const hitstop=(t,imps,hold=.06)=>imps.reduce((s,ti)=>s-clamp(t-ti,0,hold),t);
// subtle breathing so holds never go dead
function alive(p,t,a=1,seed=0){return Object.assign({},p,{lean:p.lean+Math.sin(t*2.6+seed)*.015*a,shF:p.shF+Math.sin(t*2.6+seed+.5)*.03*a,
  shB:p.shB+Math.sin(t*2.6+seed+1)*.03*a,knF:p.knF+(Math.sin(t*2.6+seed)*.5+.5)*.05*a,knB:p.knB+(Math.sin(t*2.6+seed)*.5+.5)*.05*a,head:p.head+noise(t*.8+seed)*.04*a})}

function fk(F,p){
  const D=F.d,f=p.f,s=p.sc,L={};
  const sp=[Math.sin(p.lean),-Math.cos(p.lean)];
  L.hip=[0,0];L.waist=add([0,0],sp,D.spine*.45);L.chest=add([0,0],sp,D.spine);L.neck=add([0,0],sp,D.spine+D.neck);
  const ha=p.lean+p.head;L.head=add(L.neck,[Math.sin(ha),-Math.cos(ha)],D.hr*.95);
  const shc=add(L.chest,sp,-4);L.shF=add(shc,[3,0]);L.shB=add(shc,[-3,-1]);
  L.elF=add(L.shF,dir(p.shF),D.ua);L.haF=add(L.elF,dir(p.shF+p.elF),D.fa);
  L.elB=add(L.shB,dir(p.shB),D.ua);L.haB=add(L.elB,dir(p.shB+p.elB),D.fa);
  L.hiF=[3,3];L.hiB=[-3,1];
  const sF=p.hpF-p.knF,sB=p.hpB-p.knB;
  L.knF=add(L.hiF,dir(p.hpF),D.th);L.anF=add(L.knF,dir(sF),D.sh);L.toF=add(L.anF,dir(PI/2+sF*.6),D.ft);
  L.knB=add(L.hiB,dir(p.hpB),D.th);L.anB=add(L.knB,dir(sB),D.sh);L.toB=add(L.anB,dir(PI/2+sB*.6),D.ft);
  if(p.rot){const c=L.waist,cs=Math.cos(p.rot),sn=Math.sin(p.rot);for(const k in L){const v=L[k],dx=v[0]-c[0],dy=v[1]-c[1];L[k]=[c[0]+dx*cs-dy*sn,c[1]+dx*sn+dy*cs]}}
  let low=-1e9;for(const k of['anF','anB','toF','toB'])low=Math.max(low,L[k][1]+D.fr);for(const k of['knF','knB'])low=Math.max(low,L[k][1]+D.kr);
  const y=lerp(p.y,-low*s,p.gr);
  const J={};for(const k in L)J[k]=[p.x+L[k][0]*f*s,y+L[k][1]*s];
  J.ha=ha+p.rot;J.f=f;J.s=s;J.groundGap=-(y+low*s);return J;
}
function shadow(J,a=.32){const g=Math.max(0,J.groundGap||0);const k=clamp(1-g/260);if(k<=0)return;
  ctx.save();ctx.globalAlpha=a*k;ctx.fillStyle='#1a0f24';ctx.beginPath();ctx.ellipse(J.hip[0],2,48*J.s*(.6+.4*k),9*J.s,0,0,TAU);ctx.fill();ctx.restore()}

function headXform(J,r){ctx.translate(J.head[0],J.head[1]);ctx.scale(J.f*r,r);ctx.rotate(J.ha);
  const a=J.ha,c=Math.cos(-a),s=Math.sin(-a),lx=LIGHT.dir[0]*J.f,ly=LIGHT.dir[1];LDIR=[lx*c-ly*s,lx*s+ly*c]}
function headToWorld(J,r,v){const a=J.ha,c=Math.cos(a),s=Math.sin(a);return[J.head[0]+J.f*r*(v[0]*c-v[1]*s),J.head[1]+r*(v[0]*s+v[1]*c)]}
function fist(a,b,r,m,lw){const d=nrm(sub(b,a));cel(()=>tubePath([b,add(b,d,r*.55)],[r,r*.9]),m,r*.35,r*.12,lw)}

// small-scale face (fighter scale, local head units)
function faceSmall(F,expr,t,lw,opt={}){
  const hurt=expr==='hurt',ang=expr==='angry'||expr==='shout'||expr==='focus',blink=(t%3.7)<.09&&!opt.noBlink;
  ctx.lineCap='round';
  // eye
  ctx.save();ctx.translate(.5,.0);
  if(hurt||blink){ctx.beginPath();ctx.moveTo(-.16,-.04);ctx.lineTo(.05,.04);ctx.lineTo(-.14,.1);ctx.lineWidth=lw*1.2;ctx.strokeStyle=INK;ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(-.2,-.08);ctx.quadraticCurveTo(0,-.2,.2,-.06);ctx.lineTo(.18,.12);ctx.quadraticCurveTo(0,.16,-.17,.08);ctx.closePath();
    ctx.fillStyle='#fbf7ff';ctx.fill();ctx.fillStyle=opt.glow||F.iris[0];ctx.beginPath();ctx.ellipse(.06,.02,.08,.12,0,0,TAU);ctx.fill();
    ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(.07,.03,.04,.06,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.moveTo(-.24,-.06);ctx.quadraticCurveTo(0,-.24,.26,-.1);ctx.lineWidth=lw*1.5;ctx.strokeStyle=INK;ctx.stroke();
    ctx.fillStyle='#fff';circle(.03,-.03,.025);ctx.fill()}
  // brow
  ctx.beginPath();if(ang){ctx.moveTo(.2,-.2);ctx.lineTo(-.22,-.34)}else if(hurt){ctx.moveTo(.2,-.32);ctx.lineTo(-.22,-.24)}else{ctx.moveTo(.22,-.3);ctx.quadraticCurveTo(0,-.36,-.22,-.3)}
  ctx.lineWidth=lw*(F===HAY?2.2:1.4);ctx.strokeStyle=F===HAY?INK:'#7d7fa8';ctx.stroke();ctx.restore();
  // mouth
  ctx.save();ctx.translate(.58,.62);ctx.strokeStyle=INK;ctx.lineWidth=lw;
  if(expr==='shout'||hurt){ctx.beginPath();ctx.moveTo(-.12,-.06);ctx.lineTo(.14,-.08);ctx.lineTo(.1,hurt?.06:.16);ctx.lineTo(-.08,hurt?.07:.14);ctx.closePath();ctx.fillStyle='#4a1020';ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(-.09,-.06,.2,.04)}
  else if(expr==='smirk'){ctx.beginPath();ctx.moveTo(-.12,.02);ctx.quadraticCurveTo(.02,.04,.14,-.06);ctx.stroke()}
  else if(expr==='angry'){ctx.beginPath();ctx.moveTo(-.12,0);ctx.lineTo(.14,-.02);ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(-.08,0);ctx.lineTo(.1,0);ctx.stroke()}
  ctx.restore();
}

// ---- HAYATE (fighter scale)
function hayLeg(J,sd,back,lw){const s=J.s,g=M(HAY.gi,back),sk=M(HAY.skin,back);
  const hi=J['hi'+sd],kn=J['kn'+sd],an=J['an'+sd],to=J['to'+sd];
  cel(()=>tubePath([an,to],[5.5*s,4*s]),sk,2*s,.8*s,lw);
  cel(()=>tubePath([kn,an],[10*s,11.5*s]),g,CEL_K*s,CEL_R*s,lw);
  cel(()=>tubePath([hi,kn],[13*s,10.5*s]),g,CEL_K*s,CEL_R*s,lw);
  if(!FLAT){ctx.beginPath();const m=lp(hi,kn,.55),d=nrm(sub(kn,hi));ctx.moveTo(m[0]-d[1]*6*s,m[1]+d[0]*6*s);ctx.lineTo(m[0]+d[0]*8*s,m[1]+d[1]*8*s);ctx.lineWidth=lw*.6;ctx.strokeStyle=INK;ctx.stroke()}}
function hayArm(J,sd,back,lw){const s=J.s,sk=M(HAY.skin,back),g=M(HAY.gi,back),gl=M(HAY.glove,back);
  const sh=J['sh'+sd],el=J['el'+sd],ha=J['ha'+sd];
  cel(()=>tubePath([el,ha],[6.6*s,5.6*s]),sk,2.5*s,s,lw);
  const wr=lp(el,ha,.5);cel(()=>tubePath([wr,ha],[6.8*s,6.4*s]),gl,2.5*s,s,lw);
  cel(()=>tubePath([sh,el],[7.6*s,6.6*s]),sk,2.5*s,s,lw);
  const sl=lp(sh,el,.48);cel(()=>{tubePath([sh,sl],[10.5*s,10*s])},g,3*s,s,lw);
  fist(el,ha,7.8*s,gl,lw)}

let AC=null,NB=null;
function initAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function nz(dur,f0,f1,q,gain,type='bandpass'){const n=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,n);f.frequency.exponentialRampToValueAtTime(f1,n+dur);
  const g=AC.createGain();g.gain.setValueAtTime(gain,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);s.connect(f).connect(g).connect(AC.destination);s.start(n);s.stop(n+dur)}
function tone(dur,f0,f1,gain,type='sine'){const n=AC.currentTime,o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);const g=AC.createGain();g.gain.setValueAtTime(gain,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+dur)}
const SFX={whoosh:()=>nz(.28,400,2400,1.2,.35),hit:()=>{nz(.16,3000,600,.7,.6,'lowpass');tone(.18,180,50,.6)},heavy:()=>{nz(.35,2000,200,.6,.8,'lowpass');tone(.35,140,35,.9)},
  step:()=>tone(.12,120,60,.4),slide:()=>nz(.8,1500,400,.8,.25),shing:()=>{tone(.6,2400,2600,.12,'triangle');tone(.6,3600,3500,.06,'sine')},
  charge:()=>{tone(1.4,90,420,.12,'sawtooth');nz(1.4,300,3000,2,.12)},blast:()=>{nz(.5,1200,300,1,.5);tone(.5,300,90,.3,'square')},boomS:()=>{nz(.8,900,80,.5,.6,'lowpass');tone(.6,90,30,.6)},
  beam:()=>{tone(1.6,110,140,.12,'sawtooth');nz(1.6,800,1200,1.5,.2)},yell:()=>{tone(.9,160,120,.15,'sawtooth');nz(.9,600,900,3,.15)},boom:()=>{nz(2.2,1200,40,.4,1,'lowpass');tone(1.6,70,25,1)},wind:()=>nz(2.5,300,500,.6,.1)};
const EVENTS=[];SHOTS.forEach((s,i)=>(s.sfx||[]).forEach(([t,k])=>EVENTS.push([STARTS[i]+t,k])));EVENTS.sort((a,b)=>a[0]-b[0]);
function fireSfx(a,b){if(!AC||!soundOn)return;for(const[t,k]of EVENTS)if(t>=a&&t<b&&SFX[k])SFX[k]()}

// ============================================================ player UI
let T=0,playing=false,last=0,soundOn=false,looping=true;
const $=id=>document.getElementById(id);
function fmt(s){const m=Math.floor(s/60);return m+':'+(s%60).toFixed(1).padStart(4,'0')}
function sizeCanvas(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;const k=clamp((r.width*dpr)/W,.5,1.5);if(Math.abs(k-KPX)>.01||cv.width!==Math.round(W*k)){KPX=k;cv.width=Math.round(W*k);cv.height=Math.round(H*k)}}
const scEl=$('scenes');SHOTS.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b>${s.name}`;b.onclick=()=>{T=STARTS[i]+.001;draw()};scEl.appendChild(b)});
let curShot=-1;
function draw(){const i=render(T);$('scrub').value=Math.round(T/TOTAL*1000);$('time').textContent=fmt(T)+' / '+fmt(TOTAL);
  if(i!==curShot){curShot=i;[...scEl.children].forEach((b,j)=>b.classList.toggle('on',j===i))}}
function loop(now){if(!playing)return;const dt=Math.min(.1,(now-last)/1000);last=now;const prev=T;T+=dt;
  if(T>=TOTAL){if(looping){fireSfx(prev,TOTAL);T=0}else{T=TOTAL-1e-4;setPlay(false)}}else fireSfx(prev,T);
  draw();requestAnimationFrame(loop)}
function setPlay(p){playing=p;$('play').textContent=p?'Pause':'Play';$('bigplay').hidden=p;if(p){last=performance.now();requestAnimationFrame(loop)}}
$('play').onclick=()=>setPlay(!playing);$('bigplay').onclick=()=>setPlay(true);
$('restart').onclick=()=>{T=0;draw();setPlay(true)};
$('scrub').oninput=e=>{T=e.target.value/1000*TOTAL;draw()};
$('sound').onclick=()=>{soundOn=!soundOn;if(soundOn){initAudio();AC.resume()}$('sound').textContent=soundOn?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',soundOn)};
$('loop').onclick=()=>{looping=!looping;$('loop').setAttribute('aria-pressed',looping)};
$('fs').onclick=()=>{const el=$('screenBox');try{(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen()).catch(()=>{})}catch(e){}};
cv.onclick=()=>setPlay(!playing);
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();setPlay(!playing)}});
addEventListener('resize',()=>{sizeCanvas();if(!playing)draw()});
buildAssets();sizeCanvas();T=1.6;draw();
// offline rendering hook (used to export the video)
window.__anim={total:TOTAL,shots:SHOTS.map((s,i)=>({name:s.name,start:STARTS[i],d:s.d})),frame:(t,k)=>{KPX=k||1;cv.width=Math.round(W*KPX);cv.height=Math.round(H*KPX);render(t)}};
</script>
