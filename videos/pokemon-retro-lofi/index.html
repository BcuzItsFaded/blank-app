<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #1a1024;
        --ink: #f7e9c9;
        --hud: #ff5a5a;
        --sky: #4fc3f7;
        --font-mono: "Menlo", "Consolas", "Courier New", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-mono); color: var(--ink); overflow: hidden; }
      #scene {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, #ff9a6b 0%, #ff6f91 45%, #3d2b5f 100%);
      }
      #hill { position: absolute; left: -200px; right: -200px; bottom: 0; height: 360px; background: #2f7d4f; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
      #ball {
        position: absolute; left: 1310px; top: 560px; width: 180px; height: 180px; border-radius: 50%;
        border: 8px solid #111; background: linear-gradient(180deg, #e3350d 0 49%, #111 49% 53%, #f4f4f4 53% 100%); opacity: 0;
      }
      #scan {
        position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(180deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 5px);
      }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.6) 100%); }
      .hud { position: absolute; font-size: 40px; color: var(--ink); text-shadow: 3px 3px 0 #000; }
      #rec { left: 80px; top: 70px; color: var(--hud); }
      #stamp { right: 80px; top: 70px; }
      #play { left: 80px; bottom: 70px; }
      #ascii {
        position: absolute; left: 0; right: 0; top: 0; bottom: 0; margin: auto; width: fit-content; height: fit-content;
        font-family: var(--font-mono); font-size: 22px; line-height: 1.1; color: #fff; white-space: pre; opacity: 0;
        background: #000; padding: 40px;
      }
      #recDot { display: inline-block; width: 26px; height: 26px; border-radius: 50%; background: var(--hud); margin-right: 14px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="hill"></div>
        <div id="ball"></div>
      </div>
      <div id="rec" class="clip hud" data-start="0" data-duration="8" data-track-index="2"><span id="recDot"></span>REC</div>
      <div id="stamp" class="clip hud" data-start="0" data-duration="8" data-track-index="2">1998-07-04 18:32</div>
      <div id="play" class="clip hud" data-start="0" data-duration="8" data-track-index="2">PLAY ▶ PALLET TOWN</div>
      <div id="scan" class="clip" data-start="0" data-duration="10" data-track-index="3"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="10" data-track-index="3"></div>
      <pre id="ascii" class="clip" data-start="8" data-duration="2" data-track-index="4">
   .-"""-.
  /  ____  \
 |  (    )  |
 |===========|
 |  (    )  |
  \  ‾‾‾‾  /
   '-.___.-'</pre>
      <img id="franklin" class="clip" src="assets/franklin.jpg" alt="" data-start="6" data-duration="2" data-track-index="9" style="position:absolute;inset:0;width:1920px;height:1080px;object-fit:contain;background:#000;opacity:0;" />
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Camcorder roll-in: the scene jitters on entry, then settles.
      tl.fromTo("#scene", { x: -30, y: 8 }, { x: 0, y: 0, duration: 0.6, ease: "steps(6)" }, 0)
        .fromTo("#ball", { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 1.2, ease: "power2.out" }, 1)
        // HUD blink: REC dot toggles on a fixed beat (deterministic, not random).
        .to("#recDot", { opacity: 0, duration: 0.01, repeat: 7, yoyo: false, ease: "none" }, 0)
        .to("#ball", { y: -20, duration: 0.25, yoyo: true, repeat: 3, ease: "steps(2)" }, 2.5)
        // Switch to ASCII render for the last two seconds.
        .set("#scene", { opacity: 0 }, 8)
        .set("#rec", { opacity: 0 }, 8)
        .set("#stamp", { opacity: 0 }, 8)
        .set("#play", { opacity: 0 }, 8)
        .fromTo("#ascii", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "steps(3)" }, 8);
      tl.fromTo("#franklin", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
