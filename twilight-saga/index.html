<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twilight Saga Explained</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f14; color: #e8e8ee; font: 14px system-ui, sans-serif; }
    main { display: flex; flex-direction: column; height: 100%; padding: 12px; box-sizing: border-box; gap: 10px; }
    #stage { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
    .bar { display: flex; gap: 10px; align-items: center; }
    .bar input { flex: 1; }
    button { background: #222631; color: #fff; border: 1px solid #39404f; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    #clock { font-variant-numeric: tabular-nums; color: #9aa; }
    #boardStatus { display: none; }
  </style>
</head>
<body>
  <main>
    <canvas id="stage" width="1920" height="1080"></canvas>
    <div class="bar"><button id="play">▶ Play</button><span id="clock">0:00.0</span><input id="scrub" type="range" min="0" max="1000" value="0"></div>
    <div id="boardStatus">loading</div>
  </main>
  <script src="assets/data.js"></script>
  <script src="js/rig.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/scenes2.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
