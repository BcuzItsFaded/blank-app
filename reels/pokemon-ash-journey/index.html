<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ash and Pikachu Reel</title>
<link rel="stylesheet" href="../engine/reel.css">
<style>
  :root { --accent: #ffd84a; }
  #flash { background: #fff6c8; }
  #title .t1 { font-family: "DejaVu Sans", sans-serif; font-weight: 800; font-size: 80px; letter-spacing: 3px; color: #ffe14d;
    -webkit-text-stroke: 3px #2a4fb0; text-shadow: 0 0 22px rgba(255,220,80,.8), 0 6px 0 #1a3480; }
  #title .t2 { color: #ffe9a0; }
</style>
</head>
<body>
<div id="ui"><button id="play">Play</button> <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" style="width:260px"> <span id="tc">0.00</span></div>
<div id="stage">
  <div id="title"><div class="t1">ASH &amp;<br>PIKACHU</div><div class="t2">THE JOURNEY · 1997–2023</div><div class="t3">An anime story breakdown</div></div>
  <div id="endlogo"><span>Plot Twist <i>with A&amp;R</i></span></div>
  <div id="caption"></div>
  <div id="brand">Plot Twist <i>w/ A&amp;R</i></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="../engine/engine.js"></script>
<script src="captions.js"></script>
<script src="scenes.js"></script>
<script>
"use strict";
startReel({
  duration: 60,
  captions: CAPTIONS,
  grades: [
    { tint: [1.0, 1.02, 1.0], sat: 1.2, contrast: 1.12, bloom: 0.25, thr: 1.8, exposure: 0.62 },
    { tint: [1.0, 1.0, 1.03], sat: 1.15, contrast: 1.12, bloom: 0.3, thr: 1.8, exposure: 0.6 },
    { tint: [0.9, 0.98, 1.1], sat: 0.9, contrast: 1.12, bloom: 0.9, thr: 1.2, exposure: 0.85 },
    { tint: [1.06, 1.0, 0.94], sat: 1.2, contrast: 1.1, bloom: 0.6, thr: 1.5, exposure: 0.7 },
    { tint: [1.0, 1.0, 1.0], sat: 1.2, contrast: 1.12, bloom: 0.4, thr: 1.6, exposure: 0.68 },
    { tint: [0.96, 0.98, 1.06], sat: 1.15, contrast: 1.12, bloom: 0.7, thr: 1.6, exposure: 0.6 },
    { tint: [1.06, 1.0, 0.92], sat: 1.18, contrast: 1.1, bloom: 0.4, thr: 1.6, exposure: 0.66 },
    { tint: [1.06, 0.98, 0.94], sat: 1.2, contrast: 1.1, bloom: 0.6, thr: 1.5, exposure: 0.75 },
  ],
  fade: t => Math.max(t < 0.5 ? 1 - t / 0.5 : 0, t > 27.6 && t < 28.4 ? 1 - Math.abs(t - 28) / 0.4 : 0, t > 43.6 && t < 44.4 ? 1 - Math.abs(t - 44) / 0.4 : 0, t > 55.6 ? clamp((t - 55.6) / 0.4, 0, 1) : 0),
  flash: t => Math.max(
    t > 11.2 && t < 12.0 ? 0.35 * (1 - (t - 11.2) / 0.8) : 0,
    Math.max(0, 1 - Math.abs(t - 15.2) / 0.12) * 0.35, Math.max(0, 1 - Math.abs(t - 17.9) / 0.1) * 0.35,
    t > 19.1 && t < 19.9 ? 0.35 * (1 - (t - 19.1) / 0.8) : 0,
    t > 40.95 && t < 41.8 ? 0.3 * (1 - (t - 40.95) / 0.85) : 0),
  shake: t => (t > 19.1 && t < 20.3 ? 0.12 : 0) + (t > 36.3 && t < 38.6 ? 0.05 : 0) + (t > 40.95 && t < 42.4 ? 0.14 : 0) + (t > 11.2 && t < 12.0 ? 0.04 : 0),
  captionTop: t => t > 56 ? '78%' : '66%',
  title: { in: 56.4, out: 59.85 },
  endlogo: { in: 57.6, out: 59.85 },
  brandOut: 55.6,
});
</script>
</body>
</html>
