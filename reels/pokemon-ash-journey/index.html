function flameCluster(parent, x, y, z, size, n = 5) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); const R = rng(Math.floor(x * 31 + y * 17 + z * 7 + 500)), fl = [];
  for (let i = 0; i < n; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, color: [0xff6a1a, 0xffa040, 0xffd080][i % 3], transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); s.userData.ph = R() * 6; g.add(s); fl.push(s); }

    s.position.set(Math.sin(s.userData.ph) * size * 0.2, ph * size * 0.9, 0); s.scale.set(size * f * (1 - ph * 0.6), size * 1.4 * f * (1 - ph * 0.4), 1); s.material.opacity = 0.95 * (1 - ph * 0.6); }));

}

// lightning bolts built from glowing box segments (pooled, deterministic per frame)
function boltPool(scene, n, col = [6, 5.4, 1.6]) {
  const mat = new THREE.MeshBasicMaterial({ color: hdr(...col), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });

  let k = 0;

    begin() { k = 0; pool.forEach(m => m.visible = false); },
    bolt(a, b, seed, segs = 10, jit = 0.35, w = 0.1, branches = 2) {
      const R = rng(seed), pts = [a.clone()], len = a.distanceTo(b);
      for (let i = 1; i < segs; i++) { const p = a.clone().lerp(b, i / segs); p.x += (R() - 0.5) * len * jit / segs * 3; p.y += (R() - 0.5) * len * jit / segs * 3; p.z += (R() - 0.5) * len * jit / segs * 3; pts.push(p); }

        for (const [m, ww] of [[pool[k++], w], [pool[k++], w * 2.6]]) { m.visible = true; m.position.copy(p0).lerp(p1, 0.5); m.scale.set(ww, ww, d); m.lookAt(p1); }

        if (k < pool.length - 12) this.bolt(pts[i], pts[i].clone().add(dir), seed * 7 + j + 1, 4, jit, w * 0.6, 0); }
    }
  };
}
