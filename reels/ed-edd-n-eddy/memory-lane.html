<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ed Edd n Eddy Memory Lane</title>
<link rel="stylesheet" href="../engine/reel.css">
<style>
  :root { --accent: #ffd84a; }
  #flash { background: #fff6c8; }
  #caption span { background: none; font-size: 40px; font-weight: 800; letter-spacing: 1px; padding: 0;
    text-shadow: 0 3px 0 rgba(120,40,20,.9), 0 0 18px rgba(0,0,0,.7); }
  #caption small { display: block; font-size: 27px; letter-spacing: 6px; color: #ffe14d; margin-bottom: 8px; }
  #memory { position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at 50% 45%, rgba(255,200,120,0) 52%, rgba(60,30,10,.4) 100%),
                linear-gradient(160deg, rgba(255,170,80,.14) 0%, rgba(255,170,80,0) 35%, rgba(255,120,160,0) 70%, rgba(255,120,160,.1) 100%); }
  #title .t1 { font-family: "DejaVu Sans", sans-serif; font-weight: 800; font-size: 66px; letter-spacing: 2px; color: #ffe14d; line-height: 1.08;
    -webkit-text-stroke: 3px #c8302a; text-shadow: 0 6px 0 #7a1a14, 0 0 24px rgba(255,200,60,.7); }
  #title .t1 em { font-style: normal; color: #7ad8ff; -webkit-text-stroke: 3px #1a5aa8; }
  #title .t2 { color: #ffe9a0; }
  #endlogo span { border-color: #ffd84a; }
  #brand i, #endlogo i { color: #ffd84a; }
</style>
</head>
<body>
<div id="ui"><button id="play">Play</button> <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" style="width:260px"> <span id="tc">0.00</span></div>
<div id="stage">
  <div id="memory"></div>
  <div id="title"><div class="t1">ED, <em>EDD</em><br>N EDDY</div><div class="t2">MEMORY LANE · 1999–2009</div></div>
  <div id="endlogo"><span>RG <i>BrickVerse</i></span></div>
  <div id="caption"></div>
  <div id="brand">RG <i>BrickVerse</i></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="../engine/engine.js"></script>
<script src="scenes.js"></script>
<script>
"use strict";
const card = (small, big) => '<small>' + small + '</small>' + big;
const CARDS = [
  [0.5, 3.4, card('1999', 'Peach Creek')],
  [4.0, 7.0, card('THE CREW', 'Three Eds. One plan.')],
  [7.6, 10.8, card('THE SCAM', 'Jawbreakers or bust')],
  [11.3, 14.2, card('ED', 'Butter toast &amp; gravy')],
  [14.7, 17.6, card('DOUBLE D', 'Big brain. Sock hat.')],
  [18.1, 21.0, card('THE KANKERS', 'RUN!')],
  [21.6, 25.0, card('THE DAYS', 'Every scam failed.<br>Every day was gold.')],
];
const BOUNDS = [3.6, 7.2, 11.0, 14.4, 17.8, 21.2];
startReel({
  duration: 30,
  envIntensity: 0.3,
  captions: CARDS,
  grades: [
    { tint: [1.0, 1.02, 1.0], sat: 1.2, contrast: 1.1, bloom: 0.25, thr: 1.8, exposure: 0.62 },
    { tint: [1.0, 1.0, 1.0], sat: 1.2, contrast: 1.1, bloom: 0.3, thr: 1.8, exposure: 0.62 },
    { tint: [1.02, 1.0, 0.98], sat: 1.25, contrast: 1.1, bloom: 0.5, thr: 1.4, exposure: 0.62 },
    { tint: [1.02, 1.0, 0.98], sat: 1.2, contrast: 1.1, bloom: 0.3, thr: 1.7, exposure: 0.62 },
    { tint: [0.96, 0.98, 1.04], sat: 1.1, contrast: 1.12, bloom: 0.7, thr: 1.3, exposure: 0.75 },
    { tint: [1.02, 1.0, 0.98], sat: 1.2, contrast: 1.1, bloom: 0.3, thr: 1.7, exposure: 0.62 },
    { tint: [1.06, 0.98, 0.92], sat: 1.2, contrast: 1.1, bloom: 0.6, thr: 1.4, exposure: 0.58 },
  ],
  gradeAll: { lift: [0.02, 0.012, 0.0] },
  fade: t => { let f = t < 0.5 ? 1 - t / 0.5 : 0; BOUNDS.forEach(b => { f = Math.max(f, Math.max(0, 1 - Math.abs(t - b) / 0.2) * 0.8); });
    if (t > 25.3) f = Math.max(f, clamp((t - 25.3) / 1.0, 0, 1) * 0.55); if (t > 29.6) f = Math.max(f, clamp((t - 29.6) / 0.35, 0, 1)); return f; },
  flash: t => Math.max(t > 7.2 + 0.52 * 3.8 && t < 7.2 + 0.52 * 3.8 + 0.7 ? 0.3 * (1 - (t - 7.2 - 0.52 * 3.8) / 0.7) : 0, t > 16.3 && t < 17.1 ? 0.3 * (1 - (t - 16.3) / 0.8) : 0),
  shake: t => (t > 9.17 && t < 10.2 ? 0.14 : 0) + (t > 16.9 && t < 17.8 ? 0.06 : 0) + (t > 17.8 && t < 21.2 ? 0.035 : 0),
  captionTop: () => '64%',
  title: { in: 26.2, out: 29.95 },
  endlogo: { in: 27.8, out: 29.95 },
  brandOut: 25.8,
});
</script>
</body>
</html>
