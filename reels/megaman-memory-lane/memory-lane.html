<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Man Memory Lane</title>
<link rel="stylesheet" href="../engine/reel.css">
<style>
  :root { --accent: #6ae8ff; }
  #flash { background: #e8f8ff; }
  #caption span { background: none; font-size: 40px; font-weight: 800; letter-spacing: 1px; padding: 0; text-shadow: 0 3px 0 rgba(10,30,80,.95), 0 0 16px rgba(0,0,0,.7); }
  #caption small { display: block; font-size: 28px; letter-spacing: 6px; color: #6ae8ff; margin-bottom: 8px; }
  #memory { position: absolute; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(ellipse at 50% 45%, rgba(120,190,255,0) 55%, rgba(10,20,50,.4) 100%); }
  #title .t1 { font-family: "DejaVu Sans", sans-serif; font-weight: 800; font-size: 72px; letter-spacing: 3px; color: #eaffff; line-height: 1.04; -webkit-text-stroke: 3px #1a4aa8; text-shadow: 0 6px 0 #0a2a6a, 0 0 24px rgba(106,232,255,.8); }
  #title .t1 em { font-style: normal; color: #ffd84a; -webkit-text-stroke: 3px #a84a14; }
  #title .t2 { color: #bfefff; }
  #endlogo span { border-color: #6ae8ff; }
  #brand i, #endlogo i { color: #6ae8ff; }
</style>
</head>
<body>
<div id="ui"><button id="play">Play</button> <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" style="width:260px"> <span id="tc">0.00</span></div>
<div id="stage">
  <div id="memory"></div>
  <div id="title"><div class="t1">MEGA<br><em>MAN</em></div><div class="t2">MEMORY LANE · 1987–2018</div></div>
  <div id="endlogo"><span>RG <i>BrickVerse</i></span></div>
  <div id="caption"></div>
  <div id="brand">RG <i>BrickVerse</i></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="../engine/engine.js"></script>
<script src="scenes.js"></script>
<script>
"use strict";
const card = (small, big) => '<small>' + small + '</small>' + big;
const CARDS = [
  [0.4, 3.9, card('1987', 'Mega Man')],
  [4.7, 8.2, card('1988', 'Robot Masters')],
  [9.0, 12.5, card('1993', 'Mega Man X')],
  [13.3, 16.8, card('1997', 'Legends')],
  [17.6, 21.1, card('2001', 'Battle Network')],
  [21.9, 25.4, card('2018', 'Mega Man 11')],
];
const BOUNDS = [4.3, 8.6, 12.9, 17.2, 21.5, 25.8];
startReel({
  duration: 30, envIntensity: 0.3, captions: CARDS, grades: [0, 1, 2, 3, 4, 5, 6].map(() => G), gradeAll: { lift: [0.01, 0.006, 0.02] },
  fade: t => { let f = t < 0.5 ? 1 - t / 0.5 : 0; BOUNDS.forEach(b => { f = Math.max(f, Math.max(0, 1 - Math.abs(t - b) / 0.18) * 0.8); });
    if (t > 26.4) f = Math.max(f, clamp((t - 26.4) / 1.0, 0, 1) * 0.35); if (t > 29.6) f = Math.max(f, clamp((t - 29.6) / 0.35, 0, 1)); return f; },
  flash: t => (t > 28.0 && t < 28.35 ? 0.4 * (1 - (t - 28.0) / 0.35) : 0),
  shake: t => (t > 28.0 && t < 28.6 ? 0.06 : 0),
  captionTop: () => '64%', title: { in: 26.8, out: 29.95 }, endlogo: { in: 28.3, out: 29.95 }, brandOut: 26.6,
});
</script>
</body>
</html>
