  <script>
    (function () {

      var LENS = [1, 0.84, 0.95, 0.78, 1, 0.9, 0.82, 0.98, 0.86, 0.94, 0.8, 0.97];
      function sparkPts(R, r) {
        var pts = [];
        for (var i = 0; i < 24; i++) {
          var a = (i * Math.PI) / 12 - Math.PI / 2;
          var rr = i % 2 === 0 ? R * LENS[i / 2] : r;
          pts.push((Math.cos(a) * rr).toFixed(1) + "," + (Math.sin(a) * rr).toFixed(1));
        }
        return pts.join(" ");
      }
      function spark(R, color, sw) {
        return '<polygon points="' + sparkPts(R, R * 0.3) + '" fill="' + color + '" stroke="' + color + '" stroke-width="' + sw + '" stroke-linejoin="round"/>' +
          '<circle r="' + R * 0.5 + '" fill="' + color + '"/>';
      }
      function sparkSVG(color) { return '<svg viewBox="-100 -100 200 200" width="100%" height="100%">' + spark(88, color, 14) + "</svg>"; }

      // ---- character rig: a Claude spark with line limbs ----
      function rig(id, o) {
        o = o || {};
        var L = 'stroke="' + INK + '" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"';
        var s = '<svg viewBox="-130 -130 260 310">';
        s += '<g class="legL"><path d="M-24 50 L-30 152 L-50 154" ' + L + "/></g>";
        s += '<g class="legR"><path d="M24 50 L30 152 L50 154" ' + L + "/></g>";
        // back arm (left)
        s += '<g class="armL"><path d="M-58 12 L-108 54" ' + L + '/><circle cx="-108" cy="54" r="9" fill="' + INK + '"/>';

        s += "</g>";
        s += '<g class="bod">' + spark(92, o.color || OR, 14);
        s += '<g class="face">';
        if (o.glasses) {
          s += '<rect x="-50" y="-22" width="100" height="30" rx="12" fill="' + INK + '"/><path d="M-36 -14 L-22 -14" stroke="#fff" stroke-width="5" stroke-linecap="round"/>';
        } else {
          s += '<g class="eyes"><ellipse cx="-22" cy="-6" rx="14" ry="18" fill="#fff"/><ellipse cx="22" cy="-6" rx="14" ry="18" fill="#fff"/>' +
            '<circle class="pup" cx="' + (-19 + (o.look || 0)) + '" cy="-3" r="8" fill="' + INK + '"/><circle class="pup" cx="' + (25 + (o.look || 0)) + '" cy="-3" r="8" fill="' + INK + '"/></g>';
        }
        s += '<path class="mouth" d="M-12 22 Q0 32 12 22" stroke="' + INK + '" stroke-width="6" stroke-linecap="round" fill="none"/>';
        s += "</g>";
        if (o.band) s += '<path d="M-74 -40 Q0 -62 74 -40" stroke="#c4473a" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M70 -42 L104 -60 M70 -40 L100 -28" stroke="#c4473a" stroke-width="10" stroke-linecap="round"/>';

        if (o.cap) s += '<path d="M-56 -56 Q0 -104 56 -56 Z" fill="' + INK + '"/><rect x="20" y="-62" width="64" height="12" rx="6" fill="' + INK + '"/>';
        if (o.phones) s += '<path d="M-66 -6 A66 66 0 0 1 66 -6" stroke="' + INK + '" stroke-width="10" fill="none"/><rect x="-80" y="-14" width="22" height="40" rx="8" fill="' + INK + '"/><rect x="58" y="-14" width="22" height="40" rx="8" fill="' + INK + '"/>';
        s += "</g>";
        // front arm (right)
        s += '<g class="armR"><path d="M58 12 L108 54" ' + L + '/><circle cx="108" cy="54" r="9" fill="' + INK + '"/>';
        if (o.clap) {
          s += '<g transform="translate(96 -40)"><rect x="0" y="0" width="250" height="150" rx="8" fill="' + INK + '"/>' +
            '<text x="16" y="52" font-family="Archivo Black" font-size="36" fill="' + CREAM + '">ULTRACODE</text>' +

            '<text x="16" y="134" font-family="JetBrains Mono" font-size="22" fill="#bdb8ac">dir. Claude</text>' +
            '<g class="clapTop"><rect x="0" y="-30" width="250" height="28" rx="5" fill="' + CREAM + '" stroke="' + INK + '" stroke-width="4"/>' +
            '<path d="M24 -30 L44 -2 M74 -30 L94 -2 M124 -30 L144 -2 M174 -30 L194 -2 M224 -30 L244 -2" stroke="' + INK + '" stroke-width="14"/></g></g>';
        }
        if (o.scissors) s += '<g transform="translate(112 50)"><g class="bladeA"><path d="M0 0 L52 -18" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/><circle cx="-10" cy="6" r="10" fill="none" stroke="' + OR + '" stroke-width="6"/></g><g class="bladeB"><path d="M0 0 L52 18" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/><circle cx="-10" cy="-6" r="10" fill="none" stroke="' + OR + '" stroke-width="6"/></g></g>';
        if (o.roller) s += '<g transform="translate(108 54)"><path d="M0 0 L30 -10 L30 -50" stroke="' + INK + '" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="12" y="-82" width="70" height="30" rx="10" fill="#e09a6b" stroke="' + INK + '" stroke-width="5"/></g>';
        if (o.stamp) s += '<g transform="translate(108 40)"><rect x="-6" y="-60" width="60" height="60" rx="8" fill="' + INK + '"/><text x="8" y="-14" font-family="Archivo Black" font-size="44" fill="' + OR + '">T</text></g>';
        if (o.thumb) s += '<path d="M108 54 L108 30" stroke="' + INK + '" stroke-width="10" stroke-linecap="round"/>';
        s += "</g></svg>";
        var el = document.getElementById(id);
        el.innerHTML = s;
        var q = function (c) { return el.querySelector("." + c); };
        gsap.set(q("armL"), { svgOrigin: "-58 12" });
        gsap.set(q("armR"), { svgOrigin: "58 12" });

        if (q("eyes")) gsap.set(q("eyes"), { svgOrigin: "0 -6" });

        '<rect x="60" y="112" width="210" height="100" rx="14" fill="' + INK + '"/>' +
        '<polygon points="270,132 330,110 330,214 270,192" fill="' + INK + '"/>' +
        '<circle cx="96" cy="162" r="10" fill="#c4473a"/>' +
        "</g></svg>";

        '<g class="b2">' + spark(180, "#e07a3f", 24) + "</g>" +

        "</svg>";

      // waveform on A1
      var wf = "";
      for (var i = 0; i < 118; i++) {
        var h = 8 + Math.abs(Math.sin(i * 0.53) * 18 + Math.sin(i * 0.17) * 12) ;
        wf += '<div style="position:absolute;left:' + (8 + i * 10) + "px;top:" + (28 - h / 2) + "px;width:5px;height:" + h + 'px;border-radius:3px;background:#e8e6dc"></div>';
      }
      document.getElementById("s-a1").innerHTML = wf;

      var tl = gsap.timeline({ paused: true });

      gsap.set(["#s-say1", "#s-say2", "#s-lb1", "#s-lb2", "#s-ttl", "#s-wipe"], { opacity: 0 });
      gsap.set("#s-set", { scale: 1, x: 0, y: 0, transformOrigin: "0 0", clipPath: "circle(0% at 50% 50%)" });
      gsap.set(["#s-wf", "#s-tlp", "#s-mon"], { opacity: 0 });
      gsap.set(".row .fl", { scaleX: 0 });
      gsap.set(".row .ck", { opacity: 0, scale: 0.4 });
      gsap.set(".row", { opacity: 0.35 });
      gsap.set("#s-usefill", { scaleX: 0.09 });
      gsap.set(".clipv", { opacity: 0, y: -40 });
      gsap.set("#s-a1", { scaleX: 0 });
      gsap.set("#s-v2", { opacity: 0, scale: 1.5 });
      gsap.set("#s-ph", { opacity: 0, x: 0 });
      gsap.set(".agent", { opacity: 0, y: 40 });
      gsap.set("#s-boom .b1, #s-boom .b2, #s-boom .b3", { scale: 0, svgOrigin: "0 0" });

      tl.fromTo("#s-burst", { scale: 0.6, rotation: 0, opacity: 1 }, { scale: 2.2, rotation: 70, opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
