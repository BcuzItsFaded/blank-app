      function sparkSVG(color) {
        var lens = [1, 0.84, 0.95, 0.78, 1, 0.9, 0.82, 0.98, 0.86, 0.94, 0.8, 0.97];
        var n = 12, pts = [];
        for (var i = 0; i < n * 2; i++) {
          var a = (i * Math.PI) / n - Math.PI / 2 + (i % 2 ? 0 : 0.04 * ((i * 7) % 3 - 1));
          var r = i % 2 === 0 ? 92 * lens[i / 2] : 26;
          pts.push((Math.cos(a) * r).toFixed(1) + "," + (Math.sin(a) * r).toFixed(1));
        }
        return '<svg viewBox="-100 -100 200 200" width="100%" height="100%"><polygon points="' + pts.join(" ") +
          '" fill="' + color + '" stroke="' + color + '" stroke-width="14" stroke-linejoin="round"/><circle r="30" fill="' + color + '"/></svg>';
      }
      document.getElementById("t-spinglyph").innerHTML = sparkSVG("#d97757");
      document.getElementById("t-zoom").innerHTML = sparkSVG("#d97757");

      function chars(id, text) {

        el.innerHTML = text.split("").map(function (c) { return '<span class="ch">' + (c === " " ? "&nbsp;" : c) + "</span>"; }).join("");

      }

      var c2 = chars("t-typed2", "shoot and edit a 30s action trailer with the crew");

      gsap.set("#t-r2", { color: "#d97757" });

      gsap.set("#t-cam", { scale: 1, x: 0, y: 0, transformOrigin: "50% 50%" });

      // cursor blink (finite)

      // enter -> picker

        tl.set("#t-r" + prev, { color: "#e8e6dc" }, s[0]);
        tl.set("#t-r" + s[1], { color: "#d97757" }, s[0]);
        prev = s[1];
      });
      tl.fromTo("#t-r5d", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.95);
      tl.fromTo("#t-new", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 3.05);

      // punch-in on the ultracode row (hard punch, then ease out)
