function qmark(cx, cy, s, u, seed = 5000) {

}
function speedBurst(cx, cy, r0, r1, n, seed) { for (let i = 0; i < n; i++) { const a = i / n * 6.28 + rr(seed, i, -0.15, 0.15); brush([[cx + Math.cos(a) * r0, cy + Math.sin(a) * r0], [cx + Math.cos(a) * r1, cy + Math.sin(a) * r1]], 5, { seed: seed + i, taper: [0.1, 0.5] }); } }

// ---------------------------------------------------------------- boiling hand captions
const HOT = new Set(C.hot);
function captions(t) {
  let page = null; for (const p of C.pages) if (t >= p.t) page = p;
  if (!page) return;
  const pi = C.pages.indexOf(page), next = C.pages[pi + 1], out = 0;

}

// ---------------------------------------------------------------- the film
const G = C.ground;
function wipe(t, t0, seed) {   // element-carried transition: a wall of smoke puffs fills the scene and clears
  const u = seg(t, t0, t0 + 0.6); if (u <= 0 || u >= 1) return;
  for (let i = 0; i < 14; i++) { const x = (i % 4) * 300 + 30 + ((i >> 2) % 2) * 150, y = 700 + Math.floor(i / 4) * 260 + rr(seed, i, -40, 40);

}
function frame(t) {

  const A = tq < C.wipe1 + 0.25, Bsc = tq >= C.shake && tq < C.wipe1 + 0.25, Csc = tq >= C.wipe1 + 0.25 && tq < C.wipe2 + 0.25, D = tq >= C.wipe2 + 0.25;

      if (roar > 0.3) { for (let i = 0; i < 4; i++) flame(600 - i * 45, y + 80 - i * 75, 90 + i * 25 * roar, 60, 2600 + i); puff(480, y - 240, 50 * roar, 2650, 1, 0); }
      if (love) {
        for (let i = 0; i < 6; i++) { const t0 = C.crush + 0.2 + i * 0.45, k = seg(tq, t0, t0 + 1.6); if (k > 0 && k < 1) drawHeart(720 + rr(77, i, -120, 160) + Math.sin(k * 8 + i) * 18, y - 220 - k * 240, 18 + 10 * Math.sin(k * Math.PI), 2700 + i * 3); }
        if (tq >= C.dream) { const k = eBack(seg(tq, C.dream, C.dream + 0.25)); X.save(); X.translate(470, 680); X.scale(k, k); X.translate(-470, -680);

    groundLine(C.far, -20, 620, 7); groundLine(G, -20, W + 20, 3);
    const cu = seg(tq, C.cage[0], C.cage[1]), top = lerp(300, 760, eBack(cu)), rk = Math.sin(tq * 9) * 0.04 * (tq > C.cage[1] ? 1 : 0);

    for (let i = 0; i < 2; i++) brush([[860 + i * 26, by - 250 - i * 20], [868 + i * 26, by - 226 - i * 20]], 4, { seed: 4100 + i + BOIL });
    X.restore();
    pipe(330, G);
    let x = 330, lift = 0, sx = 1, sy = 1, rot = 0, eyes = 'open', look = 1, mouth = 'o', armPose = 'up', brow = 0, show = tq >= C.pipe_pop;
    if (show && tq < C.pipe_land) { const u = seg(tq, C.pipe_pop, C.pipe_land); x = lerp(330, 560, u); lift = 215 + Math.sin(u * Math.PI) * 300 - u * 215; rot = u * Math.PI * 2; sx = 0.9; sy = 1.15; eyes = 'closed';
      if (T.f === Math.round(C.pipe_pop * FPS) + 1) { sx = 0.6; sy = 2.0; speedLines(x, G - lift - 60, 0, -1, 4, 260, 4200, 110); } }
    if (tq >= C.pipe_land) { x = 560; const k = seg(tq, C.pipe_land, C.pipe_land + 0.25); if (k < 1) { sx = 1 + 0.3 * (1 - k); sy = 1 - 0.28 * (1 - k); }
      eyes = 'closed'; mouth = 'o'; armPose = 'down'; rot = Math.sin(tq * 5) * 0.12;
      if (tq < C.dizzy_end) for (let i = 0; i < 3; i++) { const a = tq * 6 + i * 2.1; twinkle(x + Math.cos(a) * 135, G - 360 + Math.sin(a) * 30, 16, 4300 + i); }
      if (tq >= C.dizzy_end) { rot = Math.sin((tq - C.dizzy_end) * 30) * 0.22 * (1 - seg(tq, C.dizzy_end, C.determined)); eyes = 'open'; mouth = 'smile'; armPose = 'down'; }
      if (tq >= C.determined) { rot = 0; eyes = 'open'; brow = 1; mouth = 'grin'; armPose = 'up'; look = 1; const j = seg(tq, C.determined + 0.1, C.determined + 0.5); lift = Math.sin(j * Math.PI) * 90;

        const s2 = seg(tq, C.determined + 0.3, C.determined + 0.6); if (s2 > 0 && s2 < 1) star(x + 180, G - 400, 40 * Math.sin(s2 * Math.PI), 5, 4450, 0, YEL, 0.45, 4); }
    }

    if (show && tq < C.pipe_pop + 0.5) puff(330, G - 230, 60, 4500, eOut(seg(tq, C.pipe_pop, C.pipe_pop + 0.15)), seg(tq, C.pipe_pop + 0.1, C.pipe_pop + 0.5));
  }

    groundLine(C.far, -20, W + 20, 7);
    const sp = seg(tq, C.spread[0], C.spread[1]);
    // flames on the far ground + house caps, spreading right to left
    if (sp > 0) { for (let i = 0; i < 9; i++) { const fx = 1040 - i * 115, ig = clamp(sp * 1.6 - i * 0.07); if (ig > 0) flame(fx, C.far + 4, 70 + 130 * eOut(ig) + 20 * Math.sin(i), 80 + 30 * ig, 5100 + i * 5); }
      [[640, 0.55, 0.15], [420, 0.65, 0.35], [140, 0.8, 0.6]].forEach(([hx, s, d], i) => { const ig = clamp((sp - d) * 2.5); if (ig > 0) for (let k = 0; k < 3; k++) flame(hx + (k - 1) * 55 * s * 1.4, C.far - 150 * s + Math.abs(k - 1) * 30 * s, 60 + 110 * ig * s, 60 * s + 20, 5200 + i * 10 + k); }); }
    groundLine(G, -20, W + 20, 3);
    const mouth = tq >= C.turtle_beat ? (tq < C.breath[0] ? 0.4 * seg(tq, C.turtle_beat + 0.4, C.breath[0]) : tq < C.breath[1] + 0.3 ? 1 : 0.5) : 0;
    const ty = 1000 + Math.sin(BOIL * 0.9) * 5 - (tq >= C.turtle_beat && tq < C.breath[0] ? 20 * eOut(seg(tq, C.turtle_beat, C.turtle_beat + 0.4)) : 0);
    turtle(810, ty, 1.15, { mouth, look: -1 });
    if (tq >= C.breath[0] && tq < C.breath[1]) { const u = seg(tq, C.breath[0], C.breath[0] + 0.25); const ex = lerp(600, 470, u), ey = lerp(ty + 200, G - 20, u); breathCone(810 - 80 * 1.15, ty + 110 * 1.15, ex, ey, 70 + 60 * u, 5300); puff(ex - 30, ey - 30, 70 * u, 5310, 1, 0); }
    // near-ground flames right of the hero
    if (sp > 0) for (let i = 0; i < 5; i++) { const fx = 470 + i * 90, ig = clamp(sp * 2 - i * 0.12); if (ig > 0) flame(fx, G + 6, 90 + 150 * eOut(ig) + 25 * Math.sin(i * 2), 90 + 30 * ig, 5400 + i * 5); }

    if (tq >= C.hero_beat) { const k = seg(tq, C.hero_beat, C.hero_beat + 0.3); lift = Math.sin(k * Math.PI) * 50; armPose = 'up'; mouth2 = 'grin'; }
    if (tq >= C.breath[0]) { mouth2 = 'o'; armPose = 'up'; sx = 0.92; sy = 1.06; }
    if (tq >= C.spread[0] + 1.2) { mouth2 = 'grin'; brow = 1; }
    blob({ x: 230, ground: G, sx, sy, lift, eyes, look, mouth: mouth2, arms: 1, armPose, scale: 1.25, seed: 40, band: true, brow });
    if (tq >= C.hero_beat && tq < C.hero_beat + 0.5) speedBurst(230, G - 210, 220, 280, 10, 5500 + T.boil);
    if (tq >= C.qmark) { const k = seg(tq, C.qmark, C.qmark + 0.3); X.save(); X.translate(560, 820); const s2 = eBack(clamp(k * 1.2)); X.scale(s2, s2); X.translate(-560, -820); qmark(560, 820, 1.25, eOut(k)); X.restore();
      if (k >= 1) { twinkle(400, 730, 16 + 4 * Math.sin(BOIL), 5600); twinkle(720, 980, 14, 5601); } }
  }
  wipe(tq, C.wipe1, 7000); wipe(tq, C.wipe2, 7100);

  X.setTransform(1, 0, 0, 1, 0, 0);
  captions(tq);
  // paper grain over everything
  X.globalCompositeOperation = 'multiply'; X.globalAlpha = 0.13; X.drawImage(tex, 0, 0);
  X.globalAlpha = 0.10; X.drawImage(grainImg, -((T.boil * 397) % 600), -((T.boil * 211) % 400), 2048 * 1.3, 2048 * 1.3);

}
function speedLines(x, y, dx, dy, n, len, seed, spread = 46, w = 4) {

window.renderAt = async (t) => { frame(t); };
frame(0);
window.__ready = true;
