<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// "FROM" — collage / cut-out version. Kraft ground, scissor-cut paper with white rims and drop shadows, halftone dots,
// 1854 newsprint, a CC0 vintage portrait as a puppet narrator (jaw on a hinge), ransom-note captions, 12 fps stop-motion
// with +/-2 px hand-placement jitter, scene changes slapped on as new torn sheets. Every frame is a pure function of t.
const W = 1080, H = 1920, FPS = 24;
const C = await (await fetch('/demos/26-from-collage/cues.json')).json();
window.DEMO = { width: W, height: H, fps: FPS, duration: C.duration };
const cv = document.getElementById('c'), X = cv.getContext('2d');
const FONTS = ['bold 80px "DejaVu Serif"', '900 80px Inter', 'bold 80px "Liberation Sans"', 'bold 80px "Courier 10 Pitch"', 'italic bold 80px "Liberation Serif"', 'bold 80px "Bitstream Charter"'];
for (const f of FONTS) await document.fonts.load(f, 'ABCabc?');
await document.fonts.ready;

const A = {}; for (const n of ['p_face', 'p_jaw', 'p_lid', 'news_a', 'news_b', 'manicule', 'flame0', 'flame1', 'page_kraft', 'page_red']) { const im = new Image(); im.src = `/demos/26-from-collage/assets/${n}.${n.startsWith('page') ? 'jpg' : 'png'}`; A[n] = im; }
const grain = new Image(); grain.src = '/assets/textures/grain/grain_film35_2048.png';
const paperTex = new Image(); paperTex.src = '/assets/textures/paper/Paper001_4K_color.jpg';
await Promise.all([...Object.values(A), grain, paperTex].map(i => i.decode()));

const INK = '#16130f', RIM = '#f4eee0', CREAM = '#efe4cb', RED = '#c8362b', YEL = '#e9b434', NAVY = '#1b2340', PINE = '#3f5a33', GREY = '#8d8a80', TEAL = '#2f6f73', PALE = '#efe6d2';
const hash = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const rr = (s, i, a = -1, b = 1) => a + (b - a) * hash(s * 131 + 7, i);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, u) => a + (b - a) * u, seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3), eIn = u => u * u * u, eIO = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eBack = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const ell = (cx, cy, rx, ry, a0 = 0, a1 = Math.PI * 2, n = 40) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; };

// ---------------------------------------------------------------- stop-motion timing: 12 fps, hits on 24, end hold on 8
let HOLD = 0;
const ONES = [[5.1, 5.5], [18.55, 18.9], [38.95, 39.3], [47.3, 47.7]];
function timing(t) {
  const f = Math.min(Math.round(C.duration * FPS) - 1, Math.round(t * FPS)), tt = f / FPS;
  const step = tt >= C.hold ? 3 : ONES.some(([a, b]) => tt >= a && tt < b) ? 1 : 2;
  return { f, tq: (f - (f % step)) / FPS, hold: Math.floor(f / Math.max(2, step)) };
}
const jit = (id, a = 2) => [rr(id * 7 + 1, HOLD, -a, a), rr(id * 7 + 2, HOLD, -a, a)];   // hand-placement jitter per held frame

// ---------------------------------------------------------------- textures and patterns
const mkPat = (draw, w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return X.createPattern(c, 'repeat'); };
const DOTS = mkPat((p, w) => { p.fillStyle = 'rgba(0,0,0,0.55)'; for (const [x, y] of [[3, 3], [9, 9]]) { p.beginPath(); p.arc(x, y, 2.1, 0, 7); p.fill(); } }, 12, 12);
const DOTSL = mkPat((p) => { p.fillStyle = 'rgba(255,255,255,0.5)'; for (const [x, y] of [[3, 3], [9, 9]]) { p.beginPath(); p.arc(x, y, 1.8, 0, 7); p.fill(); } }, 12, 12);
const NEWS = X.createPattern(A.news_a, 'repeat'), KRAFT = X.createPattern(A.page_kraft, 'repeat'), REDP = X.createPattern(A.page_red, 'repeat');
const LINES = mkPat((p, w, h) => { p.fillStyle = CREAM; p.fillRect(0, 0, w, h); p.strokeStyle = 'rgba(60,90,160,0.35)'; p.lineWidth = 2; p.beginPath(); p.moveTo(0, h - 1); p.lineTo(w, h - 1); p.stroke(); }, 40, 70);

// ---------------------------------------------------------------- cut-paper primitive
function tornRect(x0, y0, x1, y1, seed, tooth = 7) {
  const pts = [], step = 22;
  const edge = (ax, ay, bx, by, k) => { const n = Math.max(2, Math.round(Math.hypot(bx - ax, by - ay) / step)); for (let i = 0; i < n; i++) { const u = i / n; pts.push([lerp(ax, bx, u) + (ay === by ? 0 : rr(seed + k, i, -tooth, tooth)), lerp(ay, by, u) + (ay === by ? rr(seed + k, i, -tooth, tooth) : 0)]); } };
  edge(x0, y0, x1, y0, 1); edge(x1, y0, x1, y1, 2); edge(x1, y1, x0, y1, 3); edge(x0, y1, x0, y0, 4); return pts;
}
function path(pts) { X.beginPath(); pts.forEach((p, i) => i ? X.lineTo(p[0], p[1]) : X.moveTo(p[0], p[1])); X.closePath(); }
// fill: colour string | CanvasPattern ; o: {rim, dots, shadow, id}
function cut(pts, fill, o = {}) {
  const { rim = 6, dots = 0.0, shadow = 1, id = 0, light = false } = o;
  const [jx, jy] = jit(id, o.jitter ?? 2);
  X.save(); X.translate(jx, jy);
  path(pts); X.lineJoin = 'round';
  if (shadow) { X.shadowColor = 'rgba(20,12,5,0.38)'; X.shadowBlur = 9; X.shadowOffsetX = 4; X.shadowOffsetY = 7; }
  if (rim) { X.lineWidth = rim * 2; X.strokeStyle = RIM; X.stroke(); }
  X.fillStyle = rim ? RIM : fill; X.fill(); X.shadowColor = 'transparent';
  X.fillStyle = fill; X.fill();
  if (dots > 0) { X.globalAlpha = dots; X.fillStyle = light ? DOTSL : DOTS; X.fill(); X.globalAlpha = 1; }
  X.restore();
}
function img(im, x, y, w, h, o = {}) {
  const [jx, jy] = jit(o.id || 0, o.jitter ?? 2);
  X.save(); X.translate(x + jx + w / 2, y + jy + h / 2); X.rotate(o.rot || 0); if (o.flip) X.scale(-1, 1);
  if (o.shadow !== 0) { X.shadowColor = 'rgba(20,12,5,0.38)'; X.shadowBlur = 9; X.shadowOffsetX = 4; X.shadowOffsetY = 7; }
  X.drawImage(im, -w / 2, -h / 2, w, h); X.restore();
}
function typed(text, x, y, size, col = INK, align = 'center', font = '"Courier 10 Pitch"', weight = 'bold') {
  X.save(); X.font = `${weight} ${size}px ${font}`; X.textAlign = align; X.fillStyle = col; X.fillText(text, x, y); X.restore();
}
function tape(x, y, w, rot, id) { X.save(); X.translate(x, y); X.rotate(rot); const [jx, jy] = jit(id, 1); X.translate(jx, jy); X.globalAlpha = 0.72; X.fillStyle = '#e8dcae'; path(tornRect(-w / 2, -16, w / 2, 16, id, 3)); X.fill(); X.globalAlpha = 1; X.restore(); }

// ---------------------------------------------------------------- the portrait puppet (CC0): lid + face + hinged jaw
const PH = { jaw: [372.75, 470.5], head: [371.6, 344] };
function portrait(cx, cy, s, jaw = 0, o = {}) {   // (cx, cy) = head centre on screen
  const ox = cx - PH.head[0] * s, oy = cy - PH.head[1] * s, [jx, jy] = jit(o.id || 900, o.jitter ?? 2);
  X.save(); X.translate(ox + jx, oy + jy);
  if (o.cameo) { X.beginPath(); X.ellipse(PH.head[0] * s, PH.head[1] * s + 40 * s, 250 * s, 330 * s, 0, 0, 7); X.save(); X.shadowColor = 'rgba(20,12,5,0.4)'; X.shadowBlur = 10; X.shadowOffsetY = 6; X.fillStyle = RIM; X.lineWidth = 12; X.strokeStyle = RIM; X.stroke(); X.fill(); X.restore(); X.clip(); }
  else { X.shadowColor = 'rgba(20,12,5,0.4)'; X.shadowBlur = 10; X.shadowOffsetX = 5; X.shadowOffsetY = 8; }
  // mouth cavity behind the jaw
  X.fillStyle = '#0e0b08'; X.beginPath(); X.ellipse(PH.jaw[0] * s, (PH.jaw[1] + 30) * s, 120 * s, 70 * s, 0, 0, 7); X.fill();
  X.drawImage(A.p_lid, 0, 0, 802 * s, 1009 * s); X.drawImage(A.p_face, 0, 0, 802 * s, 1009 * s);
  X.save(); X.translate(PH.jaw[0] * s, PH.jaw[1] * s); X.rotate(-0.06 * jaw); X.translate(0, 62 * s * jaw); X.translate(-PH.jaw[0] * s, -PH.jaw[1] * s); X.drawImage(A.p_jaw, 0, 0, 802 * s, 1009 * s); X.restore();
  if (o.grin) {   // pasted-on paper grin: disproportionate, surreal
    X.shadowColor = 'transparent'; const gy = (PH.jaw[1] + 10) * s, gw = 210 * s * o.grin;
    const g = [...ell(PH.jaw[0] * s, gy, gw, 70 * s, 0, Math.PI, 18)]; path(g); X.fillStyle = RIM; X.lineWidth = 10; X.strokeStyle = RIM; X.stroke(); X.fillStyle = INK; X.fill();
    for (let k = -4; k <= 4; k++) { X.fillStyle = RIM; X.fillRect(PH.jaw[0] * s + k * gw / 5 - 7 * s, gy, 14 * s, (26 - Math.abs(k) * 3) * s); }
  }
  X.restore();
}
const talking = (t) => { for (const p of C.pages) for (const [t0, text] of p.lines) { const n = text.split(' ').length; for (let i = 0; i < n; i++) { const d = t - (t0 + i * 0.07); if (d >= 0 && d < 0.14) return d < 0.07 ? 1 : 0.5; } } return 0; };

// ---------------------------------------------------------------- props as cut paper
function pine(x, base, h, id, col = PINE) {
  const w = h * 0.45, pts = [[x, base - h]];
  for (let k = 1; k <= 3; k++) { const y = base - h + h * k / 3.3; pts.push([x + w * k / 3, y], [x + w * k / 3 * 0.5, y - h * 0.05]); }
  pts.push([x + w * 0.15, base - h * 0.04], [x + w * 0.15, base]); const all = [...pts, ...pts.map(([a, b]) => [2 * x - a, b]).reverse()];
  cut(all, col, { rim: 4, dots: 0.3, id, jitter: 1 });
}
function forest(base, id, n = 11, col = PINE) { for (let i = 0; i < n; i++) pine(60 + i * (960 / (n - 1)) + rr(id, i, -20, 20), base + rr(id, i + 30, -8, 14), 200 + 120 * hash(id, i), id + i, col); }
function house(x, base, w, h, id, lit = 0, col = CREAM) {
  cut([[x, base], [x, base - h], [x + w, base - h], [x + w, base]], col === 'news' ? NEWS : col, { rim: 5, dots: 0.15, id });
  cut([[x - 16, base - h + 4], [x + w / 2, base - h - w * 0.55], [x + w + 16, base - h + 4]], RED, { rim: 5, dots: 0.35, id: id + 1 });
  cut([[x + w * 0.18, base - h * 0.75], [x + w * 0.48, base - h * 0.75], [x + w * 0.48, base - h * 0.42], [x + w * 0.18, base - h * 0.42]], lit ? YEL : INK, { rim: 3, id: id + 2, shadow: 0 });
  cut([[x + w * 0.6, base], [x + w * 0.6, base - h * 0.52], [x + w * 0.84, base - h * 0.52], [x + w * 0.84, base]], '#6b3a22', { rim: 3, id: id + 3, shadow: 0, dots: 0.3 });
}
function car(x, gy, o = {}) {
  const { lights = 0, jaw = 0, id = 300 } = o;
  if (lights) { X.save(); X.globalAlpha = 0.45; cut([[x + 110, gy - 55], [x + 600, gy - 140], [x + 600, gy + 40]], YEL, { rim: 0, shadow: 0, id: id + 9 }); X.restore(); }
  cut([[x - 120, gy - 22], [x - 116, gy - 80], [x - 60, gy - 88], [x - 32, gy - 140], [x + 52, gy - 140], [x + 84, gy - 88], [x + 118, gy - 76], [x + 120, gy - 22]], REDP, { rim: 6, dots: 0.35, id });
  X.save(); path([[x - 24, gy - 128], [x + 46, gy - 128], [x + 70, gy - 90], [x - 48, gy - 90]]); X.fillStyle = lights ? '#2a2c38' : '#cfd8d0'; X.fill(); X.clip();
  portrait(x + 6, gy - 100, 0.075, jaw, { id: id + 5, jitter: 0, cameo: false }); X.restore();
  for (const wx of [x - 64, x + 68]) { cut(ell(wx, gy - 16, 27, 27, 0, 6.29, 16), INK, { rim: 4, id: id + 2 + (wx > x ? 1 : 0), jitter: 1 }); cut(ell(wx, gy - 16, 10, 10, 0, 6.29, 10), GREY, { rim: 0, shadow: 0, id: id + 4 }); }
}
function creature(x, gy, h, id, step = 0, reach = 0) {
  const bob = (Math.floor(step * 2) % 2) * 6;
  for (const sd of [-1, 1]) cut([[x + sd * 10 - 7, gy - h * 0.45 - bob], [x + sd * 10 + 7, gy - h * 0.45 - bob], [x + sd * 16 + 7 + (sd * ((Math.floor(step * 2) % 2) ? 8 : -8)), gy], [x + sd * 16 - 7 + (sd * ((Math.floor(step * 2) % 2) ? 8 : -8)), gy]], INK, { rim: 3, id: id + (sd > 0 ? 1 : 2) });
  cut([[x - 34, gy - h * 0.82 - bob], [x + 34, gy - h * 0.82 - bob], [x + 26, gy - h * 0.42 - bob], [x - 26, gy - h * 0.42 - bob]], '#24202c', { rim: 4, dots: 0.25, light: true, id: id + 3 });
  for (const sd of [-1, 1]) { const hx = x + sd * (46 + reach * 60), hy = gy - h * 0.4 - bob - reach * h * 0.25; cut([[x + sd * 30, gy - h * 0.8 - bob], [x + sd * 40, gy - h * 0.78 - bob], [hx + 6, hy], [hx - 6, hy]], INK, { rim: 3, id: id + 4 + sd }); }
  portrait(x, gy - h * 0.9 - bob, 0.17, 0, { cameo: true, grin: 1, id: id + 7 });
}

// ---------------------------------------------------------------- recognisable roles (archetypes, original designs)
const SUIT = '#2a2a33', TAN = '#b8955a', BROWN = '#5a3a24', DRESS = '#7a2f3a', CARDI = '#6e5a7e';
function paperFace(cx, cy, r, id, o = {}) {   // pale cut-paper face: dead eyes, frozen wide smile
  const { hair = '#2a1d15', bun = false, smile = 1, glasses = false, skin = PALE } = o;
  if (bun) cut(ell(cx, cy - r * 1.05, r * 0.5, r * 0.4, 0, 6.29, 14), hair, { rim: 3, id: id + 1 });
  cut(ell(cx, cy, r * 0.82, r, 0, 6.29, 28), skin, { rim: 5, id });
  X.save(); const [jx, jy] = jit(id); X.translate(jx, jy);
  path([...ell(cx, cy - r * 0.15, r * 0.84, r * 0.9, Math.PI * 1.08, Math.PI * 1.92, 16)]); X.fillStyle = hair; X.fill();
  for (const sd of [-1, 1]) { X.fillStyle = INK; X.beginPath(); X.ellipse(cx + sd * r * 0.32, cy - r * 0.05, r * 0.1, r * 0.13, 0, 0, 7); X.fill(); }
  if (glasses) { X.strokeStyle = INK; X.lineWidth = 3; for (const sd of [-1, 1]) { X.beginPath(); X.arc(cx + sd * r * 0.32, cy - r * 0.05, r * 0.22, 0, 7); X.stroke(); } }
  if (smile > 0) { const w = r * 0.62 * smile, y = cy + r * 0.38; X.beginPath(); X.moveTo(cx - w, y); X.quadraticCurveTo(cx, y + r * 0.42, cx + w, y); X.quadraticCurveTo(cx, y + r * 0.2, cx - w, y); X.fillStyle = INK; X.fill();
    X.strokeStyle = RIM; X.lineWidth = 2.5; X.beginPath(); X.moveTo(cx - w * 0.8, y + r * 0.1); X.quadraticCurveTo(cx, y + r * 0.27, cx + w * 0.8, y + r * 0.1); X.stroke(); }
  else { X.strokeStyle = INK; X.lineWidth = 3; X.beginPath(); X.moveTo(cx - r * 0.2, cy + r * 0.45); X.quadraticCurveTo(cx, cy + r * 0.52, cx + r * 0.2, cy + r * 0.45); X.stroke(); }
  X.restore();
}
function legs(x, top, gy, id, step, col = SUIT, gap = 14) {
  const sw = (Math.floor(step * 2) % 2) ? 8 : -8;
  for (const sd of [-1, 1]) cut([[x + sd * gap - 8, top], [x + sd * gap + 8, top], [x + sd * (gap + 2) + 8 + sd * sw, gy - 10], [x + sd * (gap + 2) - 8 + sd * sw, gy - 10]], col, { rim: 3, id: id + (sd > 0 ? 1 : 2) });
  for (const sd of [-1, 1]) cut(ell(x + sd * (gap + 6) + sd * sw, gy - 6, 16, 7, 0, 6.29, 10), INK, { rim: 2, id: id + 3 + (sd > 0 ? 1 : 0) });
}
// the polite man in the old suit and fedora; tip: 0..1 hat raised
function smileMan(x, gy, h, id, step = 0, tip = 0) {
  const bob = (Math.floor(step * 2) % 2) * 5, hip = gy - h * 0.46 - bob;
  legs(x, hip, gy, id, step);
  cut([[x - 46, gy - h * 0.8 - bob], [x + 46, gy - h * 0.8 - bob], [x + 40, hip + 6], [x - 40, hip + 6]], SUIT, { rim: 4, dots: 0.2, light: true, id: id + 6 });
  cut([[x - 12, gy - h * 0.8 - bob], [x + 12, gy - h * 0.8 - bob], [x, gy - h * 0.62 - bob]], RIM, { rim: 0, shadow: 0, id: id + 7 });
  cut([[x - 5, gy - h * 0.78 - bob], [x + 5, gy - h * 0.78 - bob], [x + 7, gy - h * 0.6 - bob], [x, gy - h * 0.56 - bob], [x - 7, gy - h * 0.6 - bob]], RED, { rim: 0, shadow: 0, id: id + 8 });
  for (const sd of [-1, 1]) { const up = sd > 0 && tip > 0; const hx = up ? x + 40 : x + sd * 52, hy = up ? gy - h * 1.02 - bob : hip + 10;
    cut([[x + sd * 40, gy - h * 0.78 - bob], [x + sd * 52, gy - h * 0.76 - bob], [hx + 7, hy], [hx - 7, hy]], SUIT, { rim: 3, id: id + 9 + sd }); cut(ell(hx, hy, 9, 9, 0, 6.29, 10), PALE, { rim: 2, id: id + 12 + sd }); }
  const hy = gy - h * 0.9 - bob; paperFace(x, hy, 40, id + 20, { hair: '#1c1712' });
  X.save(); X.translate(x, hy - 40 - tip * 34); X.rotate(-tip * 0.25);
  cut(ell(0, 0, 66, 13, 0, 6.29, 20), BROWN, { rim: 3, id: id + 30 }); cut([[-36, 2], [-30, -42], [30, -42], [36, 2]], BROWN, { rim: 3, dots: 0.25, id: id + 31 });
  cut([[-35, -6], [35, -6], [35, 2], [-35, 2]], INK, { rim: 0, shadow: 0, id: id + 32 }); X.restore();
}
// the 1950s woman in the pillbox hat; knock: 0..1 hand raised to tap
function smileWoman(x, gy, h, id, step = 0, knock = 0, dir = 1) {
  const bob = (Math.floor(step * 2) % 2) * 5, waist = gy - h * 0.55 - bob;
  legs(x, gy - h * 0.25, gy, id, step, PALE, 10);
  cut([[x - 26, waist], [x + 26, waist], [x + 70, gy - h * 0.24], [x - 70, gy - h * 0.24]], DRESS, { rim: 4, dots: 0.3, id: id + 6 });
  cut([[x - 30, gy - h * 0.8 - bob], [x + 30, gy - h * 0.8 - bob], [x + 26, waist], [x - 26, waist]], DRESS, { rim: 4, dots: 0.3, id: id + 7 });
  cut([[x - 22, gy - h * 0.8 - bob], [x + 22, gy - h * 0.8 - bob], [x, gy - h * 0.72 - bob]], RIM, { rim: 0, shadow: 0, id: id + 8 });
  for (const sd of [-1, 1]) { const raise = sd === dir && knock > 0; const tap = raise ? Math.sin(knock * Math.PI * 6) * 10 : 0;
    const hx = raise ? x + sd * 92 + tap : x + sd * 40, hy = raise ? gy - h * 0.82 - bob : waist + 30;
    cut([[x + sd * 24, gy - h * 0.78 - bob], [x + sd * 34, gy - h * 0.76 - bob], [hx + 6, hy], [hx - 6, hy]], DRESS, { rim: 3, id: id + 9 + sd }); cut(ell(hx, hy, 10, 10, 0, 6.29, 10), RIM, { rim: 2, id: id + 12 + sd }); }
  const hy = gy - h * 0.9 - bob; paperFace(x, hy, 38, id + 20, { hair: '#4a2a1a', bun: true });
  cut([[x - 22, hy - 42], [x + 22, hy - 42], [x + 20, hy - 64], [x - 20, hy - 64]], RED, { rim: 3, id: id + 30 });
}
function sheriff(x, gy, s, id, swing = 0) {
  const h = 420 * s, hip = gy - h * 0.46;
  legs(x, hip, gy, id, 0, '#3b3a30', 16 * s);
  cut([[x - 50 * s, gy - h * 0.8], [x + 50 * s, gy - h * 0.8], [x + 44 * s, hip + 6], [x - 44 * s, hip + 6]], TAN, { rim: 4, dots: 0.25, id: id + 6 });
  cut([[x - 46 * s, hip - 4], [x + 46 * s, hip - 4], [x + 46 * s, hip + 12], [x - 46 * s, hip + 12]], BROWN, { rim: 0, shadow: 0, id: id + 7 });
  const star = [...Array(10)].map((_, k) => { const a = k / 10 * 6.28 - 1.57, r = (k % 2 ? 7 : 16) * s; return [x - 22 * s + Math.cos(a) * r, gy - h * 0.68 + Math.sin(a) * r]; });
  cut(star, YEL, { rim: 2, id: id + 8 });
  // lantern arm
  const lx = x + 70 * s + Math.sin(swing) * 6, ly = hip - 10 * s;
  cut([[x + 44 * s, gy - h * 0.78], [x + 56 * s, gy - h * 0.76], [lx + 6, ly - 30 * s], [lx - 6, ly - 30 * s]], TAN, { rim: 3, id: id + 9 });
  X.save(); X.globalAlpha = 0.32; X.fillStyle = YEL; X.beginPath(); X.arc(lx, ly, 110 * s, 0, 7); X.fill(); X.restore();
  cut([[lx - 18 * s, ly - 26 * s], [lx + 18 * s, ly - 26 * s], [lx + 18 * s, ly + 26 * s], [lx - 18 * s, ly + 26 * s]], YEL, { rim: 4, id: id + 10 });
  cut([[x - 44 * s, gy - h * 0.78], [x - 56 * s, gy - h * 0.76], [x - 60 * s, hip + 6], [x - 48 * s, hip + 6]], TAN, { rim: 3, id: id + 11 });
